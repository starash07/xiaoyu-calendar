<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鱼日程表 · 主界面交互预览</title>
<style>/* 日历与甘特条的公共样式；颜色由各窗口通过 --fg / --fg2 / --fg3 / --hl / --rule / --done-* 提供 */
[hidden] { display: none !important; }
.cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; color: var(--fg3); padding-bottom: 4px; }
.cal-wd span { padding-left: 3px; }
.cal-week { margin-bottom: 6px; }
.cal-dates { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; line-height: 15px; color: var(--fg2); }
.cal-dc { padding: 0 3px; }
.cal-dc.out { color: var(--fg3); }
.cal-dc.today { color: var(--hl); font-weight: 700; }
.cal-lanes { position: relative; margin-top: 3px; }
.cal-bar { position: absolute; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-bar.done { background: var(--done-bg); color: var(--done-fg); }
.cal-bar.hot, .cal-bar.sel { box-shadow: 0 0 0 1.5px var(--hl); z-index: 1; }

.detail { display: flex; gap: 9px; border-top: 1px solid var(--rule); margin-top: 10px; padding: 10px 3px 0; }
.dt-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
.dt-body { min-width: 0; flex: 1; }
.dt-title { font-size: 12px; color: var(--fg); margin-bottom: 3px; word-break: break-word; }
.dt-meta { font-size: 11px; line-height: 1.6; color: var(--fg2); }
.dt-note { font-size: 11px; line-height: 1.6; color: var(--fg2); white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
</style>
<style>:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --field: #fbfdff;
  --fg: #315873;
  --fg2: #5a7f96;
  --fg3: #849cac;
  --rule: #e7eef2;
  --rule2: #d9e5ed;
  --hover: #eaf5fb;
  --hl: #47799f;
  --accent: #ed7f83;
  --accent-fg: #ffffff;
  --accent-soft: #fff0ed;
  --today: #4e957f;
  --today-bg: #e3f2ec;
  --weekend: #8a70d6;
  --weekend-out: #b7acd7;
  --done-bg: #e7ecee;
  --done-fg: #8b98a1;
  --danger: #c0575c;
  --shadow: 0 14px 38px #274d6930;
  /* 日期与主面板可点击控件共用白色细描边箭头；14.52px，热点对齐尖端。 */
  --date-cursor: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQuNTIiIGhlaWdodD0iMTQuNTIiIHZpZXdCb3g9Ii01IC01IDE0MCAxNDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGNsaXAtcGF0aD0idXJsKCNjbGlwMF8xNl8yKSI+CjxwYXRoIGQ9Ik0yMy40OTk2IDAuMjIwMDg0QzI5LjczOTYgLTEuOTc5OTIgMzcuMzE5NiAzLjk2MDA5IDUyLjQ1OTYgMTUuODQwMUw4Ny43MTk2IDQzLjU0MDFDMTA1LjAyIDU3LjE0MDEgMTEzLjY4IDYzLjkyMDEgMTEyLjYgNzAuODQwMUMxMTIuNDU0IDcxLjc3MzQgMTEyLjE5OSA3Mi42ODY0IDExMS44NCA3My41NjAxQzExMC41IDc2LjgyMDEgMTA3LjEgNzguNzgwMSAxMDEuMjggODAuMjYwMUM5MS4xMzk2IDgyLjg2MDEgODYuMDc5NiA4NC4xNDAxIDg0LjQxOTYgODcuMzQwMUM4NC4xODY0IDg3Ljc4NjggODMuOTk4OCA4OC4yNTU4IDgzLjg1OTYgODguNzQwMUM4Mi44Mzk2IDkyLjIwMDEgODUuMzU5NiA5Ni4yMDAxIDkwLjM3OTYgMTA0LjE4TDkxLjMzOTYgMTA1LjdDOTIuNTQ5OCAxMDcuNjIxIDkzLjM0MTcgMTA5Ljc3NSA5My42NjM5IDExMi4wMjJDOTMuOTg2MSAxMTQuMjY5IDkzLjgzMTIgMTE2LjU1OCA5My4yMDk1IDExOC43NDFDOTIuNTg3NyAxMjAuOTI1IDkxLjUxMyAxMjIuOTUyIDkwLjA1NTMgMTI0LjY5MkM4OC41OTc2IDEyNi40MzMgODYuNzg5NiAxMjcuODQ2IDg0Ljc0OTIgMTI4Ljg0MUM4Mi43MDg4IDEyOS44MzYgODAuNDgxNyAxMzAuMzg5IDc4LjIxMyAxMzAuNDY2Qzc1Ljk0NDMgMTMwLjU0MyA3My42ODQ5IDEzMC4xNCA3MS41ODIxIDEyOS4yODZDNjkuNDc5MiAxMjguNDMxIDY3LjU4IDEyNy4xNDIgNjYuMDA4MiAxMjUuNTA1QzY0LjQzNjQgMTIzLjg2NyA2My4yMjczIDEyMS45MTYgNjIuNDU5NiAxMTkuNzhMNjEuODU5NiAxMTguMDhDNTguNjM5NiAxMDkuMiA1Ny4wMzk2IDEwNC43OCA1My42Nzk2IDEwMy40NEM1My4yMTQyIDEwMy4yNTkgNTIuNzMxOCAxMDMuMTI1IDUyLjIzOTYgMTAzLjA0QzQ4LjY5OTYgMTAyLjM0IDQ0LjU1OTYgMTA1LjU0IDM2LjI5OTYgMTExLjk2QzMxLjUzOTYgMTE1LjY0IDI3Ljg5OTYgMTE3LjEyIDI0LjQ5OTYgMTE2LjE2QzIzLjU5NDcgMTE1LjkwOSAyMi43MjIxIDExNS41NTMgMjEuODk5NiAxMTUuMUMxNS43NTk2IDExMS42NiAxNS43Mzk2IDEwMC42NiAxNS42OTk2IDc4LjcwMDFMMTUuNTc5NiAzMy44NDAxQzE1LjUzOTYgMTQuNTgwMSAxNS41MTk2IDQuOTQwMDggMjEuMDk5NiAxLjQwMDA4QzIxLjg1MzMgMC45MTg4NDQgMjIuNjU4MyAwLjUyMzA3MSAyMy40OTk2IDAuMjIwMDg0WiIgZmlsbD0iI2ZmZmZmZiIgc3Ryb2tlPSIjNzk5NGEzIiBzdHJva2Utd2lkdGg9IjgiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9nPgo8ZGVmcz4KPGNsaXBQYXRoIGlkPSJjbGlwMF8xNl8yIj4KPHJlY3QgeD0iLTUiIHk9Ii01IiB3aWR0aD0iMTQwIiBoZWlnaHQ9IjE0MCIg }

* { box-sizing: border-box; }
html { margin: 0; background: transparent; }
body {
  margin: 0;
  overflow: hidden;
  background: transparent;
  color: var(--fg);
  font: 12px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  user-select: none;
}
/* 根页面保持透明，所有有底色的内容在同一个圆角面板内裁切。 */
.app-shell {
  --corner: 16px;
  position: relative;
  display: flex;
  flex-direction: column;
  max-height: var(--available-height, 1000px);
  padding-bottom: 16px;
  overflow: hidden;
  border: 1px solid #dfe9ee;
  border-radius: var(--corner);
  clip-path: inset(0 round var(--corner));
  background: var(--bg);
}
.app-shell.editing { min-height: min(var(--dialog-height, 420px), var(--available-height, 1000px)); }
.app-shell.settings-open { min-height: min(var(--settings-height, 0px), var(--available-height, 1000px)); }

button, input, textarea { font: inherit; }
button { color: inherit; cursor: var(--date-cursor); transition: background-color .15s, color .15s, transform .15s; }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid #5f93b6; outline-offset: 2px; }
button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #cbdce5; border-radius: 4px; }
.spacer { flex: 1; }

.top {
  height: 48px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 15px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  -webkit-app-region: drag;
}
.top button { -webkit-app-region: no-drag; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 5px); gap: 3px; transform: rotate(-8deg); }
.brand-mark i { width: 5px; height: 5px; border-radius: 2px; background: #8bcbe5; }
.brand-mark i:nth-child(2) { background: #f2aa9d; }
.brand-mark i:nth-child(3) { background: #f0cf75; }
.brand-mark i:nth-child(4) { background: #94d1ba; }
.brand { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
.icon { width: 29px; height: 29px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; background: transparent; color: #6d8a9d; }
.icon:hover, .ghost:hover { background: var(--hover); color: var(--fg); }
.ghost { min-height: 31px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 7px; background: transparent; color: var(--fg2); }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 33px; padding: 0 13px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
.primary:hover { background: #dc6f74; }

.workspace, .calendar-panel { flex: 0 1 auto; min-width: 0; min-height: 0; }
.workspace { display: flex; flex-direction: column; }
.calendar-panel { display: flex; flex-direction: column; overflow: hidden; }
.content {
  flex: 0 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: #cbdce5 transparent;
  padding: 16px 18px 4px;
}

/* 提醒堆：浅杏色、左对齐；收起时只露出后两张卡片的边缘。 */
.reminder-section { flex: 0 0 auto; margin-bottom: 20px; }
.reminder-head { margin: 0 2px 5px; color: #7c5c46; font-size: 10px; }
.reminder-head b { font-weight: 600; }
.reminders { position: relative; height: calc(48px + var(--peek, 15px)); overflow: visible; }
.rm-item {
  position: absolute;
  inset: 0 0 auto;
  z-index: 3;
  min-height: 48px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: 17px 16px;
  gap: 0 10px;
  align-items: center;
  padding: 7px 10px 7px 12px;
  border: 1px solid #f2e2d2;
  border-radius: 12px;
  background: #fff5ec;
  text-align: left;
  cursor: var(--date-cursor);
  opacity: 0;
  pointer-events: none;
  transform-origin: top center;
  transition: transform .25s cubic-bezier(.22, 1, .36, 1), opacity .2s ease, box-shadow .18s ease;
}
.rm-item.deck-0 { z-index: 4; opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.rm-item.deck-1 { z-index: 3; opacity: .62; transform: translateY(8px) scale(.985); }
.rm-item.deck-2 { z-index: 2; opacity: .34; transform: translateY(15px) scale(.97); }
.rm-item.deck-1 > *, .rm-item.deck-2 > * { opacity: 0; }
.rm-item.deck-0:hover { box-shadow: 0 5px 14px rgba(143, 95, 84, .12); }
.reminder-section.expanded .reminders { height: auto; max-height: 237px; overflow-y: auto; display: grid; gap: 7px; padding: 1px 2px 4px; }
.reminder-section.expanded .rm-item { position: relative; inset: auto; opacity: 1; pointer-events: auto; transform: none; }
.reminder-section.expanded .rm-item > * { opacity: 1; }
.reminder-section.is-animating { overflow: hidden; }
.rm-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #7c5c46; font-size: 12px; line-height: 17px; font-weight: 600; }
.rm-reason { align-self: start; color: #96775f; font-size: 10px; line-height: 16px; white-space: nowrap; }
.rm-bottom { grid-column: 2; grid-row: 1 / 3; align-self: center; }
.rm-ok { min-height: 26px; padding: 0 11px; border: 1px solid #efdcc8; border-radius: 8px; background: #fff; color: #a0603f; font-size: 12px; font-weight: 600; line-height: 24px; }
.rm-ok:hover { background: #fff0e2; }

.calwrap { flex: 0 0 auto; min-height: 0; position: relative; padding: 10px 0 8px; }
#cal { display: flex; flex-direction: column; }
.cal-wd { flex: 0 0 auto; height: 22px; margin-bottom: 8px; padding: 0; align-items: start; color: #9db0bc; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-indent: 2px; text-align: center; }
.cal-wd span { padding: 0; }
.cal-wd span:nth-child(n+6) { color: var(--weekend); }
/* 基础周行随宽度缩放；日程增多时由内容撑高，不截断连续日程条。 */
.cal-week { position: relative; flex: 0 0 auto; min-height: var(--week-height, 58px); margin: 0; padding: 3px 0 8px; border-top: 1px solid #eaf0f3; cursor: var(--date-cursor); touch-action: none; }
.cal-dates { position: relative; z-index: 1; height: 28px; align-items: center; color: #31597a; font: 17px/1 Bahnschrift, "Segoe UI", "Microsoft YaHei UI", sans-serif; font-variant-numeric: tabular-nums; }
.cal-dc { height: 28px; display: flex; align-items: center; justify-content: center; padding: 0; }
.cal-dc:nth-child(n+6) { color: var(--weekend); font-weight: 500; }
.cal-dc.out { color: #c3cfd6; }
.cal-dc.out:nth-child(n+6) { color: var(--weekend-out); }
.date-number { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.cal-dc.today .date-number { background: var(--today-bg); color: var(--today); font-weight: 600; }
.cal-lanes { margin-top: 6px; }
.cal-lanes:empty { margin-top: 0; }
.calwrap .cal-bar { cursor: var(--date-cursor); font-weight: 400; letter-spacing: 0; transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; }
.calwrap .cal-bar.hot, .calwrap .cal-bar.sel { filter: brightness(.98) saturate(1.08); transform: translateY(-1px); box-shadow: none; z-index: 2; }
.cal-bar.is-pinned::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: -1px 5px 0 0; border-radius: 50%; background: currentColor; vertical-align: middle; opacity: .8; }
/* 拖选越过日程条或移出日历时仍保持同一光标，由系统直接跟随鼠标。 */
body:has(.calwrap.selecting), body:has(.calwrap.selecting) * { cursor: var(--date-cursor) !important; }
.cal-dc.hov .date-number { background: #e8f3fb; color: #447da5; }
.cal-preview { position: absolute; border-radius: 8px; background: #d9edf9; opacity: .8; pointer-events: none; z-index: 0; }
.empty { margin: 14px 0 8px; text-align: center; font-size: 11px; color: var(--fg3); }
.empty button { padding: 0 4px; border: 0; background: none; color: #a0603f; }

/* 日历下方始终保留一排操作，日程很多时也能直接新建。 */
.bottom-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; margin: 14px 18px 0; }
.month-pill { flex: 1; min-width: 92px; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; border-radius: 999px; background: #eaf5fb; }
.month-step { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #5b819a; }
.month-step:hover { background: rgba(255, 255, 255, .8); color: #3f7598; }
.month-step svg { width: 15px; height: 15px; stroke-width: 1.8; }
.month-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #3f7598; font-size: 14px; font-weight: 600; letter-spacing: .3px; }
.today-button, .new-button { height: 40px; flex: 0 0 auto; border: 0; border-radius: 999px; font-size: 12px; }
.today-button { padding: 0 15px; background: #f1f5f7; color: #5e7e92; }
.today-button:hover { background: #e7eef2; }
.new-button { padding: 0 15px; background: #fff4e9; color: #a0603f; font-weight: 600; }
.new-button:hover { background: #ffecda; }
.new-button span { margin-right: 5px; font-size: 14px; font-weight: 400; }
.today-button:active, .new-button:active { transform: translateY(1px); }

/* 详情从窗口最下方展开；悬停预览，点选后才显示操作按钮。 */
.detail-section { position: relative; flex: 0 0 auto; height: 0; margin: 0 16px; overflow: hidden; opacity: 0; transition: height .24s cubic-bezier(.22, 1, .36, 1), margin-top .24s cubic-bezier(.22, 1, .36, 1), opacity .16s ease; }
.detail-section.show { height: var(--detail-height, 62px); margin-top: 12px; opacity: 1; overflow-y: auto; }
.detail-card { min-height: 62px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: start; padding: 11px 12px; border-radius: 12px; background: var(--tone-bg, #edf7f4); transition: background .22s ease; user-select: text; }
.detail-title { grid-column: 1; color: var(--tone-ink, #315873); font-size: 12px; font-weight: 600; word-break: break-word; transition: color .22s ease; }
.detail-meta { grid-column: 1; color: var(--tone-soft, #6f8b94); font-size: 10px; transition: color .22s ease; }
.detail-note { grid-column: 1 / -1; color: var(--tone-soft, #56727c); font-size: 11px; white-space: pre-wrap; word-break: break-word; transition: color .22s ease; }
.detail-card.selected .detail-title, .detail-card.selected .detail-meta, .detail-card.selected .detail-note { padding-right: 94px; }
@keyframes detail-swap { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.detail-card.swap > :not(.detail-actions) { animation: detail-swap .22s cubic-bezier(.22, 1, .36, 1); }
.detail-actions { position: absolute; top: 11px; right: 12px; display: flex; gap: 4px; }
.detail-actions button { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: #fff; color: var(--tone-ink, #4a7b74); transition: transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease; }
.detail-actions button:hover { transform: translateY(-1.5px); box-shadow: 0 1px 3px rgba(49, 88, 115, .1); }
.detail-actions button:active { transform: translateY(0); }
.detail-actions button svg { width: 14px; height: 14px; }
.detail-actions .danger:hover { color: var(--danger); }
.detail-actions .on { background: var(--tone-ink, #4a7b74); color: #fff; }

.daylabel { position: fixed; z-index: 30; padding: 2px 8px; border-radius: 6px; background: var(--hl); color: #fff; font-size: 11px; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 30px); padding: 8px 14px; border-radius: 8px; background: var(--hl); color: #fff; font-size: 11px; box-shadow: var(--shadow); pointer-events: none; }
.toast.bad { background: var(--danger); }

/* 填写弹窗 */
.overlay { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 12px; background: #39576d32; }
.dialog { display: flex; flex-direction: column; width: 100%; max-width: 440px; max-height: 100%; overflow: hidden; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: 0 10px 32px #274d6924; user-select: text; }
.dialog-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px 12px; }
.dialog h3 { flex: 0 0 auto; margin: 0; font-size: 16px; font-weight: 600; }
.dialog-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.dialog-fields { display: grid; gap: 12px; padding: 0 15px 16px 20px; }
.dialog .field { margin: 0; }
.dialog .field > label { margin-bottom: 5px; font-size: 11px; }
.dialog .optional { margin-left: 5px; color: var(--fg3); font-size: 10px; font-weight: 400; }
.dialog .field input[type=text], .dialog .field input[type=date], .dialog .field textarea { padding: 8px 10px; border-color: #e5edf2; border-radius: 9px; background: #f7fafc; }
.dialog .field #dlgTitle { height: 38px; background: #fff; font-size: 14px; }
.dialog .field textarea { display: block; height: 58px; min-height: 58px; max-height: 140px; resize: vertical; line-height: 1.6; }
.dialog input::placeholder, .dialog textarea::placeholder { color: #a0b1bd; }
.dialog .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.dialog-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; user-select: none; }
.editor-tool, .pin-tool { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 4px 10px; border: 1px solid transparent; border-radius: 8px; background: #f1f6f9; color: #607e93; font-size: 11px; cursor: var(--date-cursor); }
.editor-tool:hover, .pin-tool:hover { background: #e9f1f6; }
.editor-tool[aria-expanded=true] { border-color: #d3e3ef; background: #eaf3f9; color: #456d8b; }
.editor-tool svg { width: 13px; height: 13px; }
.editor-tool .tool-chevron { width: 11px; height: 11px; transition: transform .16s ease; }
.editor-tool[aria-expanded=true] .tool-chevron { transform: rotate(180deg); }
.color-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px #31587312; }
.pin-tool { margin-left: auto; }
.pin-tool input { margin: 0; }
.pin-tool:has(input:checked) { background: #e9f4ef; color: #4e8875; }
.editor-drawer { min-width: 0; padding: 12px; border-radius: 10px; background: #f7fafc; animation: drawer-in .16s ease-out; }
.editor-drawer .swatches { gap: 9px; padding: 3px; }
.editor-drawer .swatch { width: 23px; height: 23px; }

<script>// 日期工具：日程只精确到天，统一用 'YYYY-MM-DD' 字符串。主进程和页面共用这一份。
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RCDates = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const pad = n => String(n).padStart(2, '0');
  const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return toStr(d); };
  // b 减 a 的天数；四舍五入避开夏令时的 23/25 小时
  const diff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const today = () => toStr(new Date());
  const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const ymd = s => { const d = parse(s); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
  const WEEK = '日一二三四五六';
  const weekday = s => WEEK[parse(s).getDay()];
  const isValid = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toStr(parse(s)) === s;

  // 月网格：周一开头，第一周和最后一周不满的部分用相邻月份的日期补齐
  function monthGrid(year, month) {
    const first = new Date(year, month, 1);
    const lead = (first.getDay() + 6) % 7;
    const days = new Date(year, month + 1, 0).getDate();
    return { start: toStr(new Date(year, month, 1 - lead)), weeks: Math.ceil((lead + days) / 7) };
  }

  // 详情里的日期：单日「9/11」，多日「9/14 – 9/22」，跨年时带年份
  function rangeText(start, end) {
    if (start === end) return md(start);
    if (start.slice(0, 4) !== end.slice(0, 4)) return `${ymd(start)} – ${ymd(end)}`;
    return `${md(start)} – ${md(end)}`;
  }

  // 进度文案（需求 3.2 日程详情）
  function progressText(task, day) {
    const total = diff(task.startDate, task.endDate) + 1;
    const single = total === 1;
    if (task.done) return single ? '已完成' : `已完成 · 共 ${total} 天`;
    if (day < task.startDate) {
      const n = diff(day, task.startDate);
      return single ? `${n} 天后` : `${n} 天后开始 · 共 ${total} 天`;
    }
    if (day > task.endDate) return single ? '已结束' : `已结束 · 共 ${total} 天`;
    return single ? '就是今天' : `第 ${diff(task.startDate, day) + 1} 天 / 共 ${total} 天`;
  }

  return { pad, toStr, parse, addDays, diff, today, md, ymd, weekday, isValid, monthGrid, rangeText, progressText };
});

  h = Math.round(h * 60);

  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  const sat = Math.round(Math.min(Math.max(s, .16), .6) * 100);
  return { bg: `hsl(${h} ${Math.round(sat * .9)}% 95%)`, ink: `hsl(${h} ${sat}% 32%)`, soft: `hsl(${h} ${Math.round(sat * .75)}% 45%)` };
}

$('detailActions').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  const t = b && App.state.tasks.find(x => x.id === App.selectedId);
  if (!t) return;
  const act = b.dataset.act;
  if (act === 'edit') TaskDialog.open({ mode: 'edit', task: t });
  else if (act === 'delete') TaskDialog.confirmDelete(t);
  else if (act === 'done') report(await rc.updateTask(t.id, { done: !t.done }), t.done ? '已取消完成' : '已标记完成');
});

// 提醒栏：列出还没确认的提醒，逐条点「知道了」
function layoutReminders(animate = false) {
  const section = $('reminderSection'), box = $('reminders');
  const cards = [...box.querySelectorAll('.rm-item')];
  const moving = animate && cards.length && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 从当前画面接着运动，快速反复点击时也不会跳回动画起点。
  const oldHeight = section.getBoundingClientRect().height;
  const before = moving ? cards.map(card => ({
    rect: card.getBoundingClientRect(), opacity: getComputedStyle(card).opacity
  })) : [];
  reminderAnimations.forEach(animation => animation.cancel());
  reminderAnimations = [];
  if (cards.length < 2) remindersExpanded = false;
  section.classList.remove('is-animating');
  section.classList.toggle('expanded', remindersExpanded);
  box.style.setProperty('--peek', cards.length > 2 ? '15px' : cards.length === 2 ? '8px' : '0px');
  cards.forEach((card, index) => {
    const depth = (index - reminderIndex + cards.length) % cards.length;
    card.classList.remove('deck-0', 'deck-1', 'deck-2');
    if (!remindersExpanded && depth <= 2) card.classList.add(`deck-${depth}`);
    card.inert = !remindersExpanded && depth !== 0;
  });
  if (!remindersExpanded) box.scrollTop = 0;
  if (!moving) return;

  const newHeight = section.getBoundingClientRect().height;
  const targets = cards.map(card => {
    const style = getComputedStyle(card);
    return { rect: card.getBoundingClientRect(), transform: style.transform, opacity: style.opacity };
  });
  const timing = { duration: 320, easing: 'cubic-bezier(.22, 1, .36, 1)' };
  section.classList.add('is-animating');
  const heightAnimation = section.animate([
    { height: `${oldHeight}px`, maxHeight: 'none' },
    { height: `${newHeight}px`, maxHeight: 'none' }
  ], timing);
  heightAnimation.onfinish = () => section.classList.remove('is-animating');
  reminderAnimations.push(heightAnimation);
  cards.forEach((card, index) => {
    const from = before[index], to = targets[index];
    const matrix = new DOMMatrix(to.transform === 'none' ? undefined : to.transform);
    const x = from.rect.left + from.rect.width / 2 - (to.rect.left + to.rect.width / 2 - matrix.e);
    const y = from.rect.top - (to.rect.top - matrix.f);
    const scaleX = from.rect.width / (to.rect.width / matrix.a);
    const scaleY = from.rect.height / (to.rect.height / matrix.d);
    reminderAnimations.push(card.animate([
      { transform: `translate(${x}px, ${y}px) scale(${scaleX}, ${scaleY})`, opacity: from.opacity },
      { transform: to.transform, opacity: to.opacity }
    ], timing));
  });
}

function renderReminders() {
  const s = App.state, byId = new Map(s.tasks.map(t => [t.id, t]));
  const items = s.reminders
    .filter(r => !r.confirmed && byId.has(r.taskId) && !byId.get(r.taskId).done)
    .sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));
  const box = $('reminders');
  box.hidden = !items.length;
  $('reminderSection').hidden = !items.length;
  if (!items.length) { remindersExpanded = false; reminderIndex = 0; box.innerHTML = ''; layoutReminders(); return; }
  $('reminderHead').textContent = `待确认提醒 ${items.length} 条`;
  reminderIndex = Math.max(0, Math.min(reminderIndex, items.length - 1));
  box.innerHTML = items.map((r, index) => {
    const t = byId.get(r.taskId);
    return `<article class="rm-item" data-index="${index}" data-rid="${K.esc(r.id)}" tabindex="0">`
      + `<span class="rm-title">${K.esc(t.title)}</span>`
      + `<span class="rm-reason">${K.reminderReason(r.kind, t, s.today)}</span>`
      + `<div class="rm-bottom"><button type="button" class="rm-ok" data-rid="${K.esc(r.id)}" aria-label="确认提醒：${K.esc(t.title)}">知道了</button></div></article>`;
  }).join('');
  layoutReminders();
}

$('reminders').addEventListener('click', async e => {
  const ok = e.target.closest('.rm-ok');
  if (ok) {
    const res = await rc.confirmReminder(ok.dataset.rid);
    if (res.ok) toast('已确认提醒');
    else toast('保存失败，这条提醒保持未确认', true);
    return;
  }
  const card = e.target.closest('.rm-item');
  if (card) {
    reminderIndex = +card.dataset.index;
    remindersExpanded = !remindersExpanded;
    layoutReminders(true);
  }
});

$('reminders').addEventListener('wheel', e => {
  const cards = $('reminders').querySelectorAll('.rm-item');
  if (remindersExpanded || cards.length < 2 || Math.abs(e.deltaY) < 2) return;
  e.preventDefault();
  e.stopPropagation();
  reminderIndex = (reminderIndex + (e.deltaY > 0 ? 1 : -1) + cards.length) % cards.length;
  layoutReminders(true);
}, { passive: false });

$('reminders').addEventListener('keydown', e => {
  const card = e.target.closest('.rm-item');
  if (!card || e.target.closest('.rm-ok') || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  reminderIndex = +card.dataset.index;
  remindersExpanded = !remindersExpanded;
  layoutReminders(true);
});

function setHover(id) {
  if (id === App.hoverId) return;
  App.hoverId = id;
  K.markBars(cal, 'hot', id);
  renderDetail();
}

function select(id) {
  App.selectedId = id;
  App.hoverId = null;
  K.markBars(cal, 'hot', null);
  K.markBars(cal, 'sel', id);
  renderDetail();
}

function shiftMonth(n) {
  const d = new Date(App.view.y, App.view.m + n, 1);
  App.view = { y: d.getFullYear(), m: d.getMonth() };
  App.hoverId = null;
  App.selectedId = null;
  clearSelection();
  render();
}

function goToday() {
  const t = D.parse(App.state.today);
  App.view = { y: t.getFullYear(), m: t.getMonth() };
  App.hoverId = null;
  App.selectedId = null;
  clearSelection();
  render();
  const cell = cal.querySelector('.cal-dc.today');
  if (cell) cell.scrollIntoView({ block: 'nearest' });
}

// 直接新建默认今天；查看其他月份时默认该月 1 日，日期仍可修改。
function newTask() {
  if (TaskDialog.isOpen() || !App.state) return;
  Settings.close({ animate: false, restoreFocus: false });
  clearSelection();
  select(null);
  const today = D.parse(App.state.today), { y, m } = App.view;
  const day = y === today.getFullYear() && m === today.getMonth() ? App.state.today : D.toStr(new Date(y, m, 1));
  TaskDialog.open({ mode: 'new', start: day, end: day });
}

// 日历本身即可选日期；已有日程条保留查看详情的点击行为。
function dayAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const week = el && el.closest('.cal-week');
  if (!week || !cal.contains(week)) return null;
  const r = week.getBoundingClientRect();
  const col = Math.max(0, Math.min(6, Math.floor((x - r.left) / (r.width / 7))));
  return D.addDays(week.dataset.start, col);
}

function markHoverDay(day) {
  cal.querySelectorAll('.cal-dc.hov').forEach(n => n.classList.remove('hov'));
  if (day) { const c = cal.querySelector(`.cal-dc[data-date="${day}"]`); if (c) c.classList.add('hov'); }
}

const ordered = () => (App.sel.a <= App.sel.b ? [App.sel.a, App.sel.b] : [App.sel.b, App.sel.a]);

function drawPreview(e) {
  cal.querySelectorAll('.cal-preview').forEach(n => n.remove());
  if (!App.sel) return;
  const [a, b] = ordered();
  cal.querySelectorAll('.cal-week').forEach(week => {
    const ws = week.dataset.start, we = D.addDays(ws, 6);
    if (b < ws || a > we) return;
    const i = Math.max(0, D.diff(ws, a)), j = Math.min(6, D.diff(ws, b));
    const div = document.createElement('div');
    div.className = 'cal-preview';
    const dates = week.querySelector('.cal-dates');
    div.style.cssText = `left:calc(${i * 100 / 7}% + 2px);width:calc(${(j - i + 1) * 100 / 7}% - 4px);top:${dates.offsetTop}px;height:${dates.offsetHeight}px`;
    week.appendChild(div);
  });
  const label = $('daylabel');
  label.textContent = `${D.diff(a, b) + 1} 天`;
  if (e) { label.style.left = `${Math.min(e.clientX + 14, innerWidth - 74)}px`; label.style.top = `${Math.min(e.clientY + 12, innerHeight - 32)}px`; }
  label.hidden = false;
}

function clearSelection() {
  App.sel = null;
  const pointerId = datePointerId;
  datePointerId = null;
  if (pointerId !== null && calwrap.hasPointerCapture(pointerId)) calwrap.releasePointerCapture(pointerId);
  calwrap.classList.remove('selecting');
  markHoverDay(null);
  cal.querySelectorAll('.cal-preview').forEach(n => n.remove());
  $('daylabel').hidden = true;
  refreshBlock();
}

calwrap.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !e.isPrimary || datePointerId !== null || !App.state
    || TaskDialog.isOpen() || Settings.isOpen() || e.target.closest('.cal-bar')) return;
  const day = dayAt(e.clientX, e.clientY);
  if (!day) return;
  e.preventDefault();
  datePointerId = e.pointerId;
  App.sel = { a: day, b: day };
  calwrap.setPointerCapture(e.pointerId);
  select(null);
  markHoverDay(null);
  calwrap.classList.add('selecting');
  refreshBlock();
  drawPreview(e);
});

calwrap.addEventListener('pointermove', e => {
  if (App.sel && e.pointerId === datePointerId) {
    const day = dayAt(e.clientX, e.clientY);
    if (day) App.sel.b = day;   // 拖出日历区域：保留最后经过的那一天
    drawPreview(e);
    return;
  }
  if (e.buttons || TaskDialog.isOpen() || Settings.isOpen()) return;
  const bar = e.target.closest('.cal-bar');
  markHoverDay(bar ? null : dayAt(e.clientX, e.clientY));
  if (!App.selectedId) setHover(bar ? bar.dataset.id : null);
});

calwrap.addEventListener('pointerup', e => {
  if (e.button !== 0 || e.pointerId !== datePointerId || !App.sel) return;
  const day = dayAt(e.clientX, e.clientY);
  if (day) App.sel.b = day;
  const [a, b] = ordered();
  // 先打开弹窗再结束拖选，使阻止自动收起的状态不中断。
  TaskDialog.open({ mode: 'new', start: a, end: b });
  clearSelection();
});

calwrap.addEventListener('pointerleave', () => {
  if (App.sel) return;
  if (!App.selectedId) setHover(null);
  markHoverDay(null);
});
calwrap.addEventListener('contextmenu', e => { if (App.sel) { e.preventDefault(); clearSelection(); } });
for (const type of ['pointercancel', 'lostpointercapture']) {
  calwrap.addEventListener(type, e => { if (e.pointerId === datePointerId) clearSelection(); });
}
window.addEventListener('blur', clearSelection);
cal.addEventListener('keydown', e => {
  const bar = e.target.closest('.cal-bar');
  if (bar && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    if (!App.sel) select(bar.dataset.id);
  }
});
cal.addEventListener('click', e => {
  if (App.sel || TaskDialog.isOpen() || Settings.isOpen()) return;
  const bar = e.target.closest('.cal-bar');
  if (bar) select(bar.dataset.id);
});

// 点选日程后，点主界面的其他区域就收起详情；详情里的操作按钮不触发收起。
document.addEventListener('click', e => {
  if (!App.selectedId || e.target.closest('.cal-bar') || e.target.closest('.detail-section') || e.target.closest('.overlay') || e.target.closest('.page')) return;
  select(null);
});

// —— 月份与快捷操作 ——
$('prevBtn').addEventListener('click', () => shiftMonth(-1));
$('nextBtn').addEventListener('click', () => shiftMonth(1));
$('todayBtn').addEventListener('click', goToday);
$('newBtn').addEventListener('click', newTask);
$('emptyNewBtn').addEventListener('click', newTask);
$('settingsBtn').addEventListener('click', () => Settings.open());
$('closeBtn').addEventListener('click', () => rc.hideW2());

// —— 键盘 ——
document.addEventListener('keydown', e => {
  if (TaskDialog.confirmOpen()) return;   // 删除确认框自己处理 Esc
  if (e.key === 'Escape') {
    if (TaskDialog.isOpen()) return;        // 填写弹窗里按 Esc 不关闭
    if (Settings.isOpen()) Settings.close();
    else if (App.sel) { e.preventDefault(); clearSelection(); }
    else if (App.selectedId) select(null);
    return;
  }
  if (TaskDialog.isOpen() || Settings.isOpen()) return;
  const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName);
  if (e.ctrlKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newTask(); }
  else if (e.key === 'PageUp') { e.preventDefault(); shiftMonth(-1); }
  else if (e.key === 'PageDown') { e.preventDefault(); shiftMonth(1); }
  else if (e.key === 'Delete' && !typing && App.selectedId) {
    const t = App.state.tasks.find(x => x.id === App.selectedId);
    if (t) TaskDialog.confirmDelete(t);
  }
});

// —— 主进程发来的命令：托盘「新建日程」「设置」，以及用户主动收起时放弃填写 ——
rc.onCommand(cmd => {
  if (cmd.type === 'new') newTask();
  else if (cmd.type === 'settings') Settings.open();
  else if (cmd.type === 'discard') { TaskDialog.discard(); Settings.close({ animate: false, restoreFocus: false }); clearSelection(); }
});

rc.onState(s => { App.state = s; render(); if (Settings.isOpen()) Settings.render(); });
rc.getState().then(s => { App.state = s; render(); });

window.W2App = { App, toast, report, refreshBlock, render, select, clearSelection };
</script>
<script>// 新建 / 编辑日程的填写弹窗 + 删除确认框
// 填写弹窗只能用鼠标点「保存」「取消」：按 Enter 不保存（备注里 Enter 是换行），按 Esc 不关闭
const TaskDialog = (() => {
  const modal = $('modal'), confirmEl = $('confirm');
  const q = id => document.getElementById(id);
  let ctx = null;          // { mode: 'new' | 'edit', taskId, color }
  let confirmCtx = null;   // { id }
  let layoutObserver = null;
  let layoutFrame = 0;

  const state = () => W2App.App.state;

  function remindSummary(o) {
    const parts = [];
    if (o.startBefore.on) parts.push(`开始前 ${o.startBefore.days} 天`);
    if (o.startDay) parts.push('开始当天');
    if (o.endBefore.on) parts.push(`结束前 ${o.endBefore.days} 天`);
    if (o.endDay) parts.push('结束当天');
    return parts.length ? parts.join('、') : '不提醒';
  }

  function open({ mode, task, start, end }) {
    layoutObserver?.disconnect();
    const st = state();
    const t = task || {
      title: '', startDate: start, endDate: end, note: '', pinned: false, remind: null,
      color: st.settings.lastColor || C.PRESETS[0][1],   // 默认用最近一次用过的颜色，第一次用预设第 1 色
    };
    ctx = { mode, taskId: task ? task.id : null, color: t.color.toUpperCase() };
    const g = st.settings.reminder, r = t.remind || g;
    const chevron = '<svg class="tool-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
    modal.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgHead">
        <div class="dialog-header">
          <h3 id="dlgHead">${mode === 'new' ? '新建日程' : '编辑日程'}</h3>
          <div class="preview-bar" id="dlgPreview" aria-label="日程条预览"></div>
        </div>
        <div class="dialog-scroll">
          <div class="dialog-fields">
            <div class="field"><label for="dlgTitle">标题</label>
              <input type="text" id="dlgTitle" maxlength="50" placeholder="日程名称" autocomplete="off" value="${K.esc(t.title)}">
              <div class="err" id="errTitle" role="alert" hidden></div></div>
            <div class="row2">
              <div class="field"><label for="dlgStart">开始日期</label><input type="date" id="dlgStart" value="${t.startDate}"></div>
              <div class="field"><label for="dlgEnd">结束日期</label><input type="date" id="dlgEnd" value="${t.endDate}"></div>
            </div>
            <div class="err" id="errDate" role="alert" hidden></div>
            <div class="field"><label for="dlgNote">备注<span class="optional">选填</span></label>
              <textarea id="dlgNote" maxlength="500" rows="2" placeholder="补充一些细节">${K.esc(t.note)}</textarea></div>
            <div class="dialog-tools">
              <button type="button" class="editor-tool" id="dlgColorToggle" aria-controls="dlgColorPanel" aria-expanded="false"><span class="color-dot" id="dlgColorDot" aria-hidden="true"></span>颜色${chevron}</button>
              <button type="button" class="editor-tool" id="dlgRemindToggle" aria-controls="dlgRemindPanel" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0v4l1.5 2h-13L5 12V8Zm3 8h4"/></svg><span id="dlgRemindLabel"></span>${chevron}</button>
              <label class="pin-tool" title="排在其他日程前面"><input type="checkbox" id="dlgPinned" ${t.pinned ? 'checked' : ''}>置顶</label>
            </div>
            <div class="editor-drawer" id="dlgColorPanel" aria-label="日程颜色" hidden>
              <div class="swatches" id="dlgPresets"></div>
              <div id="dlgRecentWrap"><div class="sw-sub">最近使用</div><div class="swatches" id="dlgRecent"></div></div>
              <div class="custom-color"><label for="dlgPicker">自定义</label><input type="color" id="dlgPicker" title="取色器"><input type="text" id="dlgHex" aria-label="颜色 HEX 值" maxlength="7" spellcheck="false"></div>
            </div>
            <div class="editor-drawer" id="dlgRemindPanel" aria-label="日程提醒" hidden>
              <div class="remind-mode">
                <label class="check"><input type="radio" name="dlgRemind" value="global" ${t.remind ? '' : 'checked'}>沿用统一设置</label>
                <label class="check"><input type="radio" name="dlgRemind" value="custom" ${t.remind ? 'checked' : ''}>单独设置</label>
              </div>
              <p class="remind-summary" id="dlgGlobalSummary" ${t.remind ? 'hidden' : ''}>${remindSummary(g)}</p>
              <div class="remind-grid" id="dlgRemindGrid" ${t.remind ? '' : 'hidden'}>
                <label class="check"><input type="checkbox" id="rSB" ${r.startBefore.on ? 'checked' : ''}>开始前 <input type="number" id="rSBd" aria-label="开始前几天提醒" min="1" max="365" value="${r.startBefore.days}"> 天</label>
                <label class="check"><input type="checkbox" id="rSD" ${r.startDay ? 'checked' : ''}>开始当天</label>
                <label class="check"><input type="checkbox" id="rEB" ${r.endBefore.on ? 'checked' : ''}>结束前 <input type="number" id="rEBd" aria-label="结束前几天提醒" min="1" max="365" value="${r.endBefore.days}"> 天</label>
                <label class="check"><input type="checkbox" id="rED" ${r.endDay ? 'checked' : ''}>结束当天</label>
              </div>
            </div>
          </div>
        </div>
        <div class="dialog-footer">
          <div class="err" id="errSave" role="alert" hidden></div>
          <div class="actions">
            ${mode === 'edit' ? '<button type="button" class="danger-btn" id="dlgDelete">删除</button>' : ''}
            <div class="spacer"></div>
            <button type="button" class="plain-btn" id="dlgCancel">取消</button>
            <button type="button" class="primary" id="dlgSave">保存</button>
          </div>
        </div>
      </div>`;
    modal.hidden = false;
    wire();
    paintColors();
    updatePreview();
    updateRemindLabel();
    layoutObserver = new ResizeObserver(() => {
      if (layoutFrame) return;
      layoutFrame = requestAnimationFrame(() => { layoutFrame = 0; measureDialog(); });
    });
    modal.querySelectorAll('.dialog-header, .dialog-fields, .dialog-footer').forEach(el => layoutObserver.observe(el));
    measureDialog();
    q('dlgTitle').focus();
    W2App.refreshBlock();
  }

  // 按完整表单内容申请窗口空间；空间不足时只滚动中间区域，操作按钮固定。
  function measureDialog() {
    if (!ctx) return;
    const styles = getComputedStyle(modal);
    const panel = $('appShell'), panelStyle = getComputedStyle(panel);
    const height = [...modal.querySelectorAll('.dialog-header, .dialog-fields, .dialog-footer')]
      .reduce((sum, el) => sum + el.getBoundingClientRect().height, 2)
      + parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom)
      + parseFloat(panelStyle.borderTopWidth) + parseFloat(panelStyle.borderBottomWidth);
    panel.style.setProperty('--dialog-height', `${Math.ceil(height)}px`);
  }

  function togglePanel(name) {
    const opening = q(`dlg${name}Panel`).hidden;
    for (const part of ['Color', 'Remind']) {
      const show = opening && part === name;
      q(`dlg${part}Panel`).hidden = !show;
      q(`dlg${part}Toggle`).setAttribute('aria-expanded', String(show));
    }
  }

  function readReminder() {
    if (modal.querySelector('input[name="dlgRemind"]:checked').value !== 'custom') return null;
    return {
      startBefore: { on: q('rSB').checked, days: +q('rSBd').value || 1 }, startDay: q('rSD').checked,
      endBefore: { on: q('rEB').checked, days: +q('rEBd').value || 1 }, endDay: q('rED').checked,
    };
  }

  function updateRemindLabel() {
    const custom = readReminder(), rules = custom || state().settings.reminder;
    const summary = remindSummary(rules);
    q('dlgRemindLabel').textContent = summary === '不提醒' ? '不提醒' : custom ? '提醒 · 单独' : '提醒 · 统一';
    q('dlgRemindToggle').title = summary;
  }

  function showErr(id, msg) { q(id).textContent = msg; q(id).hidden = false; }
  function hideErr(id) { q(id).hidden = true; }

  function wire() {
    q('dlgColorToggle').addEventListener('click', () => togglePanel('Color'));
    q('dlgRemindToggle').addEventListener('click', () => togglePanel('Remind'));
    q('dlgTitle').addEventListener('input', () => { hideErr('errTitle'); updatePreview(); });
    q('dlgTitle').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });   // 标题只有一行，Enter 没有反应
    ['dlgStart', 'dlgEnd'].forEach(id => q(id).addEventListener('input', () => hideErr('errDate')));
    q('dlgPicker').addEventListener('input', e => setColor(e.target.value));
    q('dlgHex').addEventListener('input', e => { const v = e.target.value.trim(); if (C.isHex(v)) setColor(v, true); });
    modal.querySelectorAll('input[name="dlgRemind"]').forEach(el => el.addEventListener('change', () => {
      const custom = modal.querySelector('input[name="dlgRemind"]:checked').value === 'custom';
      q('dlgRemindGrid').hidden = !custom;
      q('dlgGlobalSummary').hidden = custom;
      updateRemindLabel();
    }));
    q('dlgRemindGrid').addEventListener('input', updateRemindLabel);
    q('dlgCancel').addEventListener('click', close);
    q('dlgSave').addEventListener('click', save);
    const del = q('dlgDelete');
    if (del) del.addEventListener('click', () => { const t = state().tasks.find(x => x.id === ctx.taskId); if (t) confirmDelete(t); });
  }

  function paintColors() {
    const cur = ctx.color;
    const sw = (hex, title) => `<button type="button" class="swatch${hex.toUpperCase() === cur ? ' on' : ''}" data-c="${hex}" title="${title}" aria-label="${title}" aria-pressed="${hex.toUpperCase() === cur}" style="background:${hex}"></button>`;
    q('dlgPresets').innerHTML = C.PRESETS.map(([name, hex]) => sw(hex, name)).join('');
    const recent = state().settings.recentColors || [];
    q('dlgRecentWrap').hidden = !recent.length;
    q('dlgRecent').innerHTML = recent.map(hex => sw(hex, hex)).join('');
    q('dlgPicker').value = cur.toLowerCase();
    q('dlgColorDot').style.background = cur;
    modal.querySelectorAll('.swatch').forEach(b => { b.onclick = () => setColor(b.dataset.c); });
  }

  function setColor(hex, fromHex) {
    ctx.color = hex.toUpperCase();
    paintColors();
    if (!fromHex) q('dlgHex').value = ctx.color;
    updatePreview();
  }

  // 顶部预览条：用当前标题和颜色实时画出来，直接看到条上文字的效果
  function updatePreview() {
    const el = q('dlgPreview');
    el.textContent = q('dlgTitle').value.trim() || '预览';
    el.style.background = ctx.color;
    el.style.color = C.barText(ctx.color);
    if (document.activeElement !== q('dlgHex')) q('dlgHex').value = ctx.color;
  }

  async function save() {
    const title = q('dlgTitle').value.trim(), startDate = q('dlgStart').value, endDate = q('dlgEnd').value;
    let bad = false;
    if (!title) { showErr('errTitle', '标题不能为空'); bad = true; }
    if (!D.isValid(startDate) || !D.isValid(endDate)) { showErr('errDate', '请选择开始日期和结束日期'); bad = true; }
    else if (endDate < startDate) { showErr('errDate', '结束日期不能早于开始日期'); bad = true; }
    if (bad) return;
    hideErr('errSave');
    const remind = readReminder();
    const data = { title, startDate, endDate, color: ctx.color, note: q('dlgNote').value, pinned: q('dlgPinned').checked, remind };
    const mode = ctx.mode;
    q('dlgSave').disabled = true;
    const res = mode === 'new' ? await rc.createTask(data) : await rc.updateTask(ctx.taskId, data);
    if (!ctx) return;   // 等结果时弹窗已被放弃
    q('dlgSave').disabled = false;
    if (res.ok) {
      close();
      if (mode === 'new' && res.id) flash(res.id);
      else W2App.toast('已保存');
      return;
    }
    // 保存失败：提示并保留弹窗和已填内容，可以再点「保存」
    const shown = ['标题不能为空', '结束日期不能早于开始日期', '标题最多 50 个字符', '备注最多 500 个字符'];
    showErr('errSave', shown.includes(res.error) ? res.error : '保存失败，请重试。关闭后本次修改不会保留。');
  }

  function flash(id) {
    setTimeout(() => {
      document.querySelectorAll(`#cal .cal-bar[data-id="${id}"]`).forEach(el => {
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 700);
      });
    }, 60);
  }

  function close() {
    layoutObserver?.disconnect();
    layoutObserver = null;
    cancelAnimationFrame(layoutFrame);
    layoutFrame = 0;
    ctx = null;
    modal.hidden = true;
    modal.innerHTML = '';
    $('appShell').style.removeProperty('--dialog-height');
    W2App.refreshBlock();
  }

  // 用户主动收起 / 隐藏下拉窗：关掉弹窗，放弃没保存的内容
  function discard() {
    closeConfirm();
    if (ctx) close();
  }

  function confirmDelete(task) {
    confirmCtx = { id: task.id };
    confirmEl.innerHTML = `<div class="confirm-box" role="alertdialog" aria-modal="true">
        <p>删除日程『${K.esc(task.title)}』？</p>
        <div class="actions"><div class="spacer"></div>
          <button type="button" class="plain-btn" id="cfCancel">取消</button>
          <button type="button" class="danger-btn" id="cfDelete">删除</button>
        </div></div>`;
    confirmEl.hidden = false;
    q('cfCancel').onclick = closeConfirm;
    q('cfDelete').onclick = async () => {
      const id = confirmCtx.id;
      closeConfirm();
      const res = await rc.deleteTask(id);
      if (!res.ok) { W2App.toast('保存失败，已恢复原来的状态', true); return; }
      if (ctx && ctx.taskId === id) close();
      W2App.toast('已删除');
    };
    q('cfCancel').focus();
    W2App.refreshBlock();
  }

  function closeConfirm() {
    confirmCtx = null;
    confirmEl.hidden = true;
    confirmEl.innerHTML = '';
    W2App.refreshBlock();
  }

  // 删除确认框里按 Esc：等于点「取消」，不删除
  document.addEventListener('keydown', e => {
    if (confirmCtx && e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeConfirm(); }
  }, true);

  return {
    open, close, discard, confirmDelete,
    isOpen: () => !!ctx || !!confirmCtx,
    confirmOpen: () => !!confirmCtx,
  };
})();
</script>
<script>// 设置以主面板内的磨砂浮窗显示；所有设置仍沿用原有保存与桌面预览通路。
const Settings = (() => {
  const page = $('settings');
  const q = id => document.getElementById(id);
  let isOpenFlag = false, closing = false, closeTimer = null;
  let editingAppearance = false, appearanceRevision = 0;
  let layoutObserver = null, layoutFrame = 0, backdropPressed = false;
  let previousFocus = null;
  const A = RCDesktopAppearance;
  const DEFAULT_AP = A.DEFAULT;
  const SLIDERS = [
    ['panelOpacity', '玻璃不透明度', ...A.LIMITS.panelOpacity, v => `${v}%`],
    ['width', '挂件宽度', ...A.LIMITS.width, v => `${v}px`],
    ['dateFontSize', '日期字号', ...A.LIMITS.dateFontSize, v => `${v}px`],
    ['blur', '磨砂强度', ...A.LIMITS.blur, v => v === 0 ? '关闭' : String(v)],
    ['barFontSize', '日程条字号', ...A.LIMITS.barFontSize, v => `${v}px`],
    ['barHeight', '日程条高度', ...A.LIMITS.barHeight, v => `${v}px`],
  ];
  const sliderRows = rows => rows.map(([k, name, min, max, step]) => `<div class="settings-control">
    <div class="control-heading"><span class="control-label"><label for="st_${k}">${name}</label>${k === 'blur' ? `<button type="button" class="settings-help" id="stGlassWarn" aria-label="磨砂说明"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.3"/><path d="M7.9 7.5a2.15 2.15 0 0 1 4.2.6c0 1.5-2.1 1.7-2.1 3.2"/><path d="M10 14h.01"/></svg></button>` : ''}</span><output id="st_${k}_out" for="st_${k}"></output></div>
    <input type="range" id="st_${k}" min="${min}" max="${max}" step="${step}"></div>`).join('');
  const state = () => W2App.App.state;

  function build() {
    page.innerHTML = `
      <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="stHeading">
        <header class="settings-header"><h2 id="stHeading">设置</h2>
          <button type="button" class="icon" id="stBack" aria-label="关闭设置" title="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M7 17 17 7"/></svg></button></header>
        <nav class="settings-tabs" role="tablist" aria-label="设置分类">
          <button type="button" role="tab" id="stTabAppearance" data-tab="Appearance" aria-controls="stPanelAppearance" aria-selected="true">外观</button>
          <button type="button" role="tab" id="stTabReminder" data-tab="Reminder" aria-controls="stPanelReminder" aria-selected="false" tabindex="-1">提醒</button>
          <button type="button" role="tab" id="stTabGeneral" data-tab="General" aria-controls="stPanelGeneral" aria-selected="false" tabindex="-1">通用</button>
        </nav>
        <div class="settings-scroll">
          <div class="settings-panel" id="stPanelAppearance" role="tabpanel" aria-labelledby="stTabAppearance">
            <div class="settings-grid">${sliderRows(SLIDERS.slice(0, 2))}</div>
            <div class="settings-grid settings-colors">
              <label class="settings-color" for="st_panelColor"><span>玻璃底色</span><input type="color" id="st_panelColor"></label>
              <label class="settings-color" for="st_textColor"><span>文字颜色</span><input type="color" id="st_textColor"></label>
            </div>
            <div class="settings-grid">${sliderRows(SLIDERS.slice(2, 4))}</div>
            <div class="settings-grid">${sliderRows(SLIDERS.slice(4))}</div>
            <p class="settings-notice" id="stBarWarn" hidden>条高太小，文字可能被裁切。</p>
          </div>
          <div class="settings-panel" id="stPanelReminder" role="tabpanel" aria-labelledby="stTabReminder" hidden>
            <p class="settings-intro">新建日程默认使用这些提醒，也可以在每个日程里单独调整。</p>
            <section class="settings-card"><h3>开始提醒</h3>
              <div class="reminder-option"><label for="gSB">开始前</label><span class="reminder-days"><input type="number" id="gSBd" aria-label="开始前几天提醒" min="1" max="365">天</span><input class="settings-switch" type="checkbox" role="switch" id="gSB"></div>
              <div class="reminder-option"><label for="gSD">开始当天</label><input class="settings-switch" type="checkbox" role="switch" id="gSD"></div>
            </section>
            <section class="settings-card"><h3>结束提醒</h3>
              <div class="reminder-option"><label for="gEB">结束前</label><span class="reminder-days"><input type="number" id="gEBd" aria-label="结束前几天提醒" min="1" max="365">天</span><input class="settings-switch" type="checkbox" role="switch" id="gEB"></div>
              <div class="reminder-option"><label for="gED">结束当天</label><input class="settings-switch" type="checkbox" role="switch" id="gED"></div>
            </section>
          </div>
          <div class="settings-panel" id="stPanelGeneral" role="tabpanel" aria-labelledby="stTabGeneral" hidden>
            <section class="settings-card"><h3>桌面挂件</h3><p class="settings-intro" id="stW1State"></p>
              <div class="settings-actions"><button type="button" class="settings-action" id="stPin"></button><button type="button" class="settings-action" id="stResetPos">重置位置</button></div>
            </section>
            <section class="settings-card"><label class="settings-toggle-row" for="stAuto"><span>开机自启</span><input class="settings-switch" type="checkbox" role="switch" id="stAuto"></label><p class="settings-intro">开机时自动打开小鱼。</p></section>
            <div class="settings-about"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>小鱼日程表 <small>0.1.0</small><br><small>日程只保存在这台电脑上</small></span></div>
          </div>
        </div>
        <footer class="settings-footer"><span>修改后自动保存</span><button type="button" class="settings-reset" id="stReset">恢复默认外观</button></footer>
      </section>`;
    wire();
    render();
  }

  function measure() {
    if (!isOpenFlag || closing) return;
    const overlayStyle = getComputedStyle(page), scrollStyle = getComputedStyle(page.querySelector('.settings-scroll'));
    const height = [...page.querySelectorAll('.settings-header, .settings-tabs, .settings-panel:not([hidden]), .settings-footer')]
      .reduce((sum, el) => {
        const style = getComputedStyle(el);
        // 浮窗出现时有缩放动画，取布局高度，避免用动画中的尺寸挤出滚动条。
        return sum + el.offsetHeight + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
      }, 4) + parseFloat(overlayStyle.paddingTop) + parseFloat(overlayStyle.paddingBottom)
      + parseFloat(scrollStyle.paddingTop) + parseFloat(scrollStyle.paddingBottom);
    $('appShell').style.setProperty('--settings-height', `${Math.ceil(height)}px`);
  }

  function queueMeasure() {
    if (layoutFrame) return;
    layoutFrame = requestAnimationFrame(() => { layoutFrame = 0; measure(); });
  }

  function selectTab(name, focus = false) {
    page.querySelectorAll('[role=tab]').forEach(tab => {
      const selected = tab.dataset.tab === name;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      q(`stPanel${tab.dataset.tab}`).hidden = !selected;
      if (selected && focus) tab.focus();
    });
    q('stReset').hidden = name !== 'Appearance';
    page.querySelector('.settings-scroll').scrollTop = 0;
    queueMeasure();
  }

  // 读取全部外观字段，切换分类不会丢失当前值。
  function current() {
    const ap = { panelColor: q('st_panelColor').value.toUpperCase(), textColor: q('st_textColor').value.toUpperCase() };
    for (const [k] of SLIDERS) ap[k] = +q(`st_${k}`).value;
    return ap;
  }

  function updateHints(ap) {
    for (const [k, , , , , fmt] of SLIDERS) q(`st_${k}_out`).textContent = fmt(ap[k]);
    const glassHelp = state().w1.glass?.available === false
      ? '桌面磨砂尚未启用，选择的效果会保留。' : '拖动调整磨砂强度，0 为关闭。';
    q('stGlassWarn').title = glassHelp;
    q('stGlassWarn').setAttribute('aria-label', `磨砂说明：${glassHelp}`);
    q('stBarWarn').hidden = ap.barHeight >= ap.barFontSize + 2;
    queueMeasure();
  }

  async function saveAp(patch, msg) {
    const revision = ++appearanceRevision;
    editingAppearance = false;
    let res;
    try { res = await rc.saveSettings({ w1: { appearance: patch } }); }
    catch (_) { res = { ok: false }; }
    if (revision === appearanceRevision) {
      rc.previewAppearance(null);
      render();
    }
    W2App.report(res, msg || '已保存');
    return res;
  }

  async function saveAction(action, message) {
    let result;
    try { result = await action(); } catch (_) { result = { ok: false }; }
    render();
    W2App.report(result, message);
  }

  function wire() {
    q('stBack').addEventListener('click', () => close());
    const tabs = [...page.querySelectorAll('[role=tab]')];
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab.dataset.tab));
      tab.addEventListener('keydown', event => {
        const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length : event.key === 'ArrowLeft' ? (index + tabs.length - 1) % tabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : null;
        if (next !== null) { event.preventDefault(); selectTab(tabs[next].dataset.tab, true); }
      });
    });
    for (const key of ['panelColor', 'textColor', ...SLIDERS.map(s => s[0])]) {
      const el = q(`st_${key}`);
      el.addEventListener('input', () => {
        editingAppearance = true;
        appearanceRevision++;
        const ap = current();
        updateHints(ap);
        rc.previewAppearance(ap);
      });
      el.addEventListener('change', () => { const ap = current(); saveAp({ [key]: ap[key] }); });
    }
    q('stReset').addEventListener('click', () => saveAp(DEFAULT_AP, '已恢复默认外观'));
    q('stPin').addEventListener('click', () => {
      const pinned = state().w1.pinned;
      saveAction(() => rc.setPinned(!pinned), pinned ? '已解锁，可以拖动挂件了' : '已钉住');
    });
    q('stResetPos').addEventListener('click', () => saveAction(() => rc.resetW1(), '已移回主显示器右上角'));
    for (const id of ['gSB', 'gSBd', 'gSD', 'gEB', 'gEBd', 'gED']) q(id).addEventListener('change', saveReminder);
    q('stAuto').addEventListener('change', event => {
      const on = event.target.checked;
      saveAction(() => rc.setAutoStart(on), on ? '已开启开机自启' : '已关闭开机自启');
    });
  }

  function saveReminder() {
    const days = id => Math.min(365, Math.max(1, Math.round(+q(id).value || 1)));
    const reminder = {
      startBefore: { on: q('gSB').checked, days: days('gSBd') }, startDay: q('gSD').checked,
      endBefore: { on: q('gEB').checked, days: days('gEBd') }, endDay: q('gED').checked,
    };
    q('gSBd').disabled = !reminder.startBefore.on;
    q('gEBd').disabled = !reminder.endBefore.on;
    return saveAction(() => rc.saveSettings({ reminder }), '已保存');
  }

  function render() {
    if (!isOpenFlag || closing || !page.firstChild) return;
    const s = state(), ap = A.normalize(s.settings.w1.appearance), w1 = s.w1;
    if (!editingAppearance) {
      q('st_panelColor').value = ap.panelColor.toLowerCase();
      q('st_textColor').value = ap.textColor.toLowerCase();
      for (const [k] of SLIDERS) q(`st_${k}`).value = ap[k];
    }
    updateHints(editingAppearance ? current() : ap);
    q('stW1State').textContent = !w1.pinned ? '已解锁，可以拖动挂件调整位置。'
      : w1.degraded ? '暂时无法钉到桌面，当前置于窗口底层。' : '已钉住在桌面上。';
    q('stPin').textContent = w1.pinned ? '解锁摆放' : '钉在桌面';
    const r = s.settings.reminder;
    q('gSB').checked = r.startBefore.on; q('gSBd').value = r.startBefore.days; q('gSD').checked = r.startDay;
    q('gEB').checked = r.endBefore.on; q('gEBd').value = r.endBefore.days; q('gED').checked = r.endDay;
    q('gSBd').disabled = !r.startBefore.on; q('gEBd').disabled = !r.endBefore.on;
    q('stAuto').checked = !!s.settings.general.autoStart;
  }

  function backgroundInert(value) {
    document.querySelectorAll('#appShell > .top, #appShell > .workspace').forEach(el => { el.inert = value; });
  }

  function open() {
    if (!state() || TaskDialog.isOpen()) return;
    if (isOpenFlag && !closing) return;
    if (closing) finishClose(false);
    previousFocus = document.activeElement;
    W2App.clearSelection();
    W2App.select(null);
    isOpenFlag = true;
    page.hidden = false;
    page.classList.remove('is-closing');
    build();
    backgroundInert(true);
    layoutObserver = new ResizeObserver(queueMeasure);
    page.querySelectorAll('.settings-header, .settings-tabs, .settings-panel, .settings-footer').forEach(el => layoutObserver.observe(el));
    measure();
    W2App.refreshBlock();
    q('stBack').focus({ preventScroll: true });
  }

  function finishClose(restoreFocus) {
    clearTimeout(closeTimer);
    closeTimer = null;
    isOpenFlag = closing = false;
    layoutObserver?.disconnect();
    layoutObserver = null;
    cancelAnimationFrame(layoutFrame);
    layoutFrame = 0;
    page.hidden = true;
    page.classList.remove('is-closing');
    page.innerHTML = '';
    $('appShell').style.removeProperty('--settings-height');
    backgroundInert(false);
    if (restoreFocus) (previousFocus?.isConnected ? previousFocus : $('settingsBtn')).focus({ preventScroll: true });
    W2App.refreshBlock();
  }

  function close({ animate = true, restoreFocus = true } = {}) {
    if (!isOpenFlag) return;
    if (closing && animate) return;
    closing = true;
    backdropPressed = false;
    editingAppearance = false;
    appearanceRevision++;
    rc.previewAppearance(null);
    if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { finishClose(restoreFocus); return; }
    page.classList.add('is-closing');
    closeTimer = setTimeout(() => finishClose(restoreFocus), 150);
  }

  // 只有在外侧空白按下、再在空白释放才关闭；拖动滑块后在外侧松手不误关。
  page.addEventListener('pointerdown', event => { backdropPressed = event.button === 0 && event.target === page; });
  page.addEventListener('pointercancel', () => { backdropPressed = false; });
  page.addEventListener('click', event => {
    if (event.target === page && backdropPressed) close();
    backdropPressed = false;
  });
  page.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    const items = [...page.querySelectorAll('button, input, select, summary, [tabindex]')]
      .filter(el => !el.disabled && el.tabIndex >= 0 && el.getClientRects().length);
    const first = items[0], last = items.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
  });

  return { open, close, render, isOpen: () => isOpenFlag };
})();
</script>
