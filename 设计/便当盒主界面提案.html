<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小鱼日程表 · 便当盒主界面提案</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #315873;
      --muted: #8198a8;
      --line: #e7eef2;
      --canvas: #eef3f5;
      --paper: #fbfcfc;
      --blue: #eaf5fb;
      --blue-strong: #78b8db;
      --coral: #ed7f83;
      --coral-soft: #fff0ed;
      --mint: #a8d9c5;
      --yellow: #f4d58a;
      --lavender: #c8c2e9;
      /* 文字三级墨色：深给标题、中给正文、浅给辅助 */
      --ink-2: #5a7f96;
      --ink-3: #849cac;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 18px 0;
      overflow: auto;
      background:
        radial-gradient(circle at 18% 8%, #ffffff 0 3%, transparent 22%),
        linear-gradient(145deg, #edf4f6, #e8edef);
      color: var(--ink);
      font: 12px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #5f93b6; outline-offset: 2px; }

    .app {
      width: min(480px, 100vw);
      height: auto;
      max-height: calc(100vh - 36px);
      padding-bottom: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid #dfe9ee;
      border-radius: 16px;
    }

    .topbar {
      height: 48px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .76);
    }

    .fish-mark { display: grid; grid-template-columns: repeat(2, 5px); gap: 3px; transform: rotate(-8deg); }
    .fish-mark i { width: 5px; height: 5px; border-radius: 2px; background: #8bcbe5; }
    .fish-mark i:nth-child(2) { background: #f2aa9d; }
    .fish-mark i:nth-child(3) { background: #f0cf75; }
    .fish-mark i:nth-child(4) { background: #94d1ba; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
    .prototype { color: var(--ink-3); font-size: 10px; letter-spacing: .5px; }
    .spacer { flex: 1; }
    .icon-button {
      width: 29px; height: 29px; display: grid; place-items: center; padding: 0;
      border: 0; border-radius: 9px; background: transparent; color: #6d8a9d;
    }
    .icon-button:hover { background: var(--blue); }
    .icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

    .content {
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 16px 4px;
      scrollbar-width: thin;
      scrollbar-color: #cbdce5 transparent;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { border-radius: 4px; background: #cbdce5; }

    /* 提醒：浅杏底卡片，文字左对齐，不用整条重色；下层卡片露出边缘，右上角标数量。 */
    .reminder-head { margin: 0 4px 5px; color: #7c5c46; font-size: 10px; }
    .reminder-head b { font-weight: 600; }
    .reminder-deck { flex: 0 0 auto; position: relative; height: calc(48px + var(--peek, 15px)); margin: 0 2px 12px; }
    .reminder-card {
      position: absolute;
      inset: 0 0 auto;
      z-index: 3;
      min-height: 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 17px 16px;
      gap: 0 10px;
      align-items: center;
      padding: 7px 10px 7px 12px;
      border: 1px solid #f2e2d2;
      border-radius: 12px;
      background: #fff5ec;
      text-align: left;
      transform-origin: top center;
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), opacity .2s ease;
    }
    .reminder-card:nth-child(2) { z-index: 2; opacity: .62; transform: translateY(8px) scale(.985); }
    .reminder-card:nth-child(3) { z-index: 1; opacity: .34; transform: translateY(15px) scale(.97); }
    .reminder-card:nth-child(n+2) > * { opacity: 0; }
    .reminder-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #7c5c46; font-size: 12px; line-height: 17px; font-weight: 600; text-align: left; }
    .reminder-reason { align-self: start; color: #96775f; font-size: 10px; line-height: 16px; text-align: left; }
    .reminder-ok { grid-column: 2; grid-row: 1 / 3; align-self: center; min-height: 26px; padding: 0 11px; border: 1px solid #efdcc8; border-radius: 8px; background: #fff; color: #a0603f; font-size: 12px; font-weight: 600; line-height: 24px; }
    .reminder-ok:hover { background: #fff0e2; }
    .reminder-deck.expanded { height: auto; display: grid; gap: 7px; }
    .reminder-deck.expanded .reminder-card { position: relative; opacity: 1; transform: none; }
    .reminder-deck.expanded .reminder-card > * { opacity: 1; }

    /* 月历高度随当月周数和每周条数变化，并吃掉窗口剩下的空间。 */
    .calendar-card {
      width: 100%;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px 11px 5px;
      border-radius: 14px;
      background: #f7fafb;
    }
    .weekdays {
      height: 20px;
      flex: 0 0 auto;
      margin-bottom: 7px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: start;
      color: #9db0bc;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-indent: 2px;
      text-align: center;
    }
    .weekdays span:nth-child(n+6) { color: #dba0a4; }
    .month-grid { flex: 1 0 auto; display: flex; flex-direction: column; }
    /* 行高随当周实际条数变化：没有日程的那一周只有日期行 */
    .week { flex: 1 0 auto; position: relative; border-top: 1px solid var(--line); padding-bottom: 9px; }
    .dates { height: 32px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: start; }
    .day {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      color: #31597a;
      font: 16px/22px "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .day.weekend { color: #d98a90; }
    .day.out { color: #c3cfd6; }
    .day.today { position: relative; }
    .day.today span { color: #e2696e; font-weight: 600; }
    /* 今日圆点：离数字 5px，再离下面的甘特条 9px */
    .day.today::after { content: ""; position: absolute; left: 50%; top: 27px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #e2696e; }
    .event-layer { position: relative; margin-top: 9px; height: calc(var(--lanes, 1) * 20px - 5px); pointer-events: none; }
    .event {
      --start: 0;
      --span: 1;
      --lane: 0;
      position: absolute;
      top: calc(var(--lane) * 20px);
      left: calc(var(--start) * 100% / 7 + 2px);
      width: calc(var(--span) * 100% / 7 - 4px);
      height: 15px;
      overflow: hidden;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      background: var(--event-color, var(--mint));
      color: #315a53;
      font-size: 10px;
      line-height: 15px;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
      pointer-events: auto;
      transition: filter .15s ease, transform .15s ease;
    }
    .event:hover, .event.hot { filter: brightness(.98) saturate(1.08); transform: translateY(-1px); }
    .event.locked::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: -1px 5px 0 0; border-radius: 50%; background: currentColor; vertical-align: middle; }
    /* 已完成：灰显，排在未完成的下面 */
    .event.done { --event-color: #e7ecee; color: #8b98a1; }

    .detail-slot { flex: 0 0 auto; max-height: 0; margin: 0 16px; overflow: hidden; opacity: 0; transition: max-height .24s cubic-bezier(.22, 1, .36, 1), margin .24s ease, opacity .16s ease; }
    .detail-slot.show { max-height: 168px; margin-top: 12px; opacity: 1; }
    .detail-card {
      min-height: 62px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 10px;
      align-items: start;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--tone-bg, #edf7f4);
      transition: background .22s ease;
    }
    .detail-title { grid-column: 1; color: var(--tone-ink, #315873); font-size: 12px; font-weight: 600; transition: color .22s ease; }
    .detail-meta { grid-column: 1; color: var(--tone-soft, #6f8b94); font-size: 10px; transition: color .22s ease; }
    .detail-note { grid-column: 1; color: var(--tone-soft, #56727c); font-size: 11px; transition: color .22s ease; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    /* 悬停换一条日程时，文字淡入着换，不硬切 */
    @keyframes detail-swap { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .detail-card.swap > :not(.detail-actions) { animation: detail-swap .22s cubic-bezier(.22, 1, .36, 1); }
    /* 选中后才出现的操作图标，放在右上角 */
    .detail-actions { grid-column: 2; grid-row: 1 / 4; align-self: start; display: flex; gap: 4px; }
    .detail-actions button { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: #fff; color: var(--tone-ink, #4a7b74); transition: transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease; }
    .detail-actions button:hover { transform: translateY(-1.5px); box-shadow: 0 1px 3px rgba(49, 88, 115, .1); }
    .detail-actions button:active { transform: translateY(0); }
    .detail-actions button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .detail-actions .danger:hover { color: #c0575c; }
    /* 已完成：勾变成实心 */
    .detail-actions .on { background: var(--tone-ink, #4a7b74); color: #fff; }

    /* 月份和操作全部在月历下方。 */
    /* 固定在窗口底部，不跟着内容滚动：日程多的时候也能直接点「新建日程」 */
    /* 底栏：一条药丸形的月份切换 + 回到今天 + 新建日程 */
    .bottom-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; }
    .month-pill {
      flex: 1;
      min-width: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--blue);
    }
    .month-step { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #5b819a; transition: background .15s ease, color .15s ease; }
    .month-step:hover { background: rgba(255, 255, 255, .8); color: #3f7598; }
    .month-step svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .month-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #3f7598; font-size: 14px; font-weight: 600; letter-spacing: .3px; }
    .today-button, .new-button { height: 40px; flex: 0 0 auto; padding: 0 17px; border: 0; border-radius: 999px; font-size: 12px; transition: background .15s ease, transform .15s ease; }
    .today-button { background: #f1f5f7; color: #5e7e92; }
    .today-button:hover { background: #e7eef2; }
    .new-button { background: #fff4e9; color: #a0603f; font-weight: 600; }
    .new-button:hover { background: #ffecda; }
    .today-button:active, .new-button:active { transform: translateY(1px); }
    .new-button span { margin-right: 5px; font-size: 14px; font-weight: 400; }

    @media (max-width: 420px) {
      .app { border-radius: 12px; }
      .content { padding-left: 12px; padding-right: 12px; }
      .bottom-bar, .detail-slot { margin-left: 12px; margin-right: 12px; }
      /* 窄窗口下按钮收紧，把宽度让给月份，别让它被截成「2026 年 9…」 */
      .today-button, .new-button { padding: 0 12px; }
      .month-pill { padding: 0 2px; }
      .prototype { display: none; }
      .calendar-card { padding-left: 7px; padding-right: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="小鱼日程表主界面设计提案">
    <header class="topbar">
      <span class="fish-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand">小鱼日程表</span>
      <span class="prototype">便当盒提案</span>
      <span class="spacer"></span>
      <button class="icon-button" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/></svg>
      </button>
      <button class="icon-button" type="button" aria-label="收起窗口" title="收起窗口">
        <svg viewBox="0 0 24 24"><path d="m7 7 10 10M7 17 17 7"/></svg>
      </button>
    </header>

    <div class="content">
      <div class="reminder-head" id="reminderHead"><b>待确认提醒 3 条</b></div>
      <section class="reminder-deck" id="reminderDeck" aria-label="待确认提醒">
        <article class="reminder-card" tabindex="0">
          <div class="reminder-title">新界面设计</div>
          <div class="reminder-reason">2 天后截止</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
        <article class="reminder-card" tabindex="0">
          <div class="reminder-title">完成本月复盘</div>
          <div class="reminder-reason">6 天后开始</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
        <article class="reminder-card" tabindex="0">
          <div class="reminder-title">周末出游</div>
          <div class="reminder-reason">明天开始</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
      </section>

      <section class="calendar-card" id="calendar" aria-label="2026 年 9 月月历">
        <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="month-grid">
          <div class="week">
            <div class="dates"><div class="day out">31</div><div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div><div class="day weekend">5</div><div class="day weekend">6</div></div>
            <div class="event-layer" style="--lanes:2"><button class="event" style="--start:3;--span:4;--lane:0;--event-color:#c8c2e9" data-title="阅读 · 一本新书" data-date="9月3日—9月6日" data-note="晚上读半小时，周末整理摘录。" data-color="#aaa2dc">阅读 · 一本新书</button><button class="event done" style="--start:1;--span:2;--lane:1" data-title="提交周报" data-date="9月1日—9月2日" data-note="已完成的日程灰显，排在未完成的下面。" data-color="#c3ccd2">提交周报</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">7</div><div class="day">8</div><div class="day">9</div><div class="day">10</div><div class="day">11</div><div class="day weekend">12</div><div class="day weekend">13</div></div>
            <div class="event-layer" style="--lanes:1"><button class="event" style="--start:0;--span:4;--lane:0;--event-color:#a8d9c5" data-title="项目方案整理" data-date="9月7日—9月10日" data-note="把需求、交互和剩余问题整理成一份清单。" data-color="#73bfa1">项目方案整理</button><button class="event" style="--start:5;--span:2;--lane:0;--event-color:#f6c9ad" data-title="和朋友吃饭" data-date="9月12日" data-note="晚餐，出发前确认餐厅。" data-color="#efad81">和朋友吃饭</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">14</div><div class="day">15</div><div class="day">16</div><div class="day">17</div><div class="day today"><span>18</span></div><div class="day weekend">19</div><div class="day weekend">20</div></div>
            <div class="event-layer" style="--lanes:3"><button class="event" style="--start:0;--span:7;--lane:0;--event-color:#abd5e8" data-title="新界面设计" data-date="9月14日—9月20日" data-note="主界面改成便当盒结构，行高随当周日程条数变化。" data-color="#78b8db">新界面设计</button><button class="event" style="--start:2;--span:3;--lane:1;--event-color:#c8c2e9" data-title="双周迭代 S12" data-date="9月16日—9月18日" data-note="评审放在周五上午。" data-color="#aaa2dc">双周迭代 S12</button><button class="event" style="--start:3;--span:1;--lane:2;--event-color:#f4c9d6" data-title="体检" data-date="9月17日" data-note="空腹，8:30 前到。" data-color="#e79ab0">体检</button><button class="event" style="--start:4;--span:1;--lane:2;--event-color:#f4d58a" data-title="团建" data-date="9月18日" data-note="下午出发，记得带外套。" data-color="#e6bd5e">团建</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day weekend">26</div><div class="day weekend">27</div></div>
            <div class="event-layer" style="--lanes:1"><button class="event" style="--start:3;--span:3;--lane:0;--event-color:#a8d9c5" data-title="完成本月复盘" data-date="9月24日—9月26日" data-note="回顾本月完成的事项和下月计划。" data-color="#73bfa1">完成本月复盘</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">28</div><div class="day">29</div><div class="day">30</div><div class="day out">1</div><div class="day out">2</div><div class="day out weekend">3</div><div class="day out weekend">4</div></div>
          </div>
        </div>
      </section>

    </div>

    <section class="bottom-bar" aria-label="月份切换和快捷操作">
      <div class="month-pill">
        <button class="month-step" type="button" title="上一月" aria-label="上一月">
          <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
        </button>
        <span class="month-label">2026 年 9 月</span>
        <button class="month-step" type="button" title="下一月" aria-label="下一月">
          <svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg>
        </button>
      </div>
      <button class="today-button" type="button">回到今天</button>
      <button class="new-button" type="button"><span>＋</span>新建日程</button>
    </section>

    <section class="detail-slot" id="detailSlot" aria-live="polite">
      <div class="detail-card">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-note" id="detailNote"></div>
        <div class="detail-actions" id="detailActions" hidden>
          <button type="button" title="编辑" aria-label="编辑">
            <svg viewBox="0 0 24 24"><path d="m15 5 4 4M5 19l1.2-4.2 8.5-8.5 3 3-8.5 8.5L5 19Z"/></svg>
          </button>
          <button type="button" id="detailDone" title="完成" aria-label="完成">
            <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </button>
          <button type="button" class="danger" title="删除" aria-label="删除">
            <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.8h4V7M7.5 7l.9 12.2h7.2L16.5 7"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const deck = document.getElementById('reminderDeck');
    const calendar = document.getElementById('calendar');
    const detailSlot = document.getElementById('detailSlot');
    const detailTitle = document.getElementById('detailTitle');
    const detailMeta = document.getElementById('detailMeta');
    const detailNote = document.getElementById('detailNote');
    const detailDone = document.getElementById('detailDone');
    const detailCard = document.querySelector('.detail-card');
    const detailActions = document.getElementById('detailActions');
    const reminderHead = document.getElementById('reminderHead');
    let locked = null;

    let shownBar = null;

    function showDetail(bar) {
      document.querySelectorAll('.event').forEach(item => item.classList.toggle('hot', item === bar));
      // 从一条换到另一条：让文字重新淡入一次
      if (detailSlot.classList.contains('show') && shownBar !== bar) {
        detailCard.classList.remove('swap');
        void detailCard.offsetWidth;
        detailCard.classList.add('swap');
      }
      shownBar = bar;
      detailTitle.textContent = bar.dataset.title;
      detailMeta.textContent = bar.dataset.date;
      detailNote.textContent = bar.dataset.note;
      detailSlot.classList.add('show');
      // 悬停只是预览；点选之后才出现操作按钮
      detailActions.hidden = locked !== bar;
      const tone = toneOf(getComputedStyle(bar).getPropertyValue('--event-color'));
      if (tone) {
        detailCard.style.setProperty('--tone-bg', tone.bg);
        detailCard.style.setProperty('--tone-ink', tone.ink);
        detailCard.style.setProperty('--tone-soft', tone.soft);
      }
      const done = bar.classList.contains('done');
      detailDone.classList.toggle('on', done);
      detailDone.title = detailDone.ariaLabel = done ? '取消完成' : '完成';
    }

    function hideDetail() {
      if (locked) return;
      shownBar = null;
      detailCard.classList.remove('swap');
      document.querySelectorAll('.event').forEach(item => item.classList.remove('hot'));
      detailSlot.classList.remove('show');
      detailActions.hidden = true;
    }

    // 从甘特条的颜色推出一套：很浅的底、压暗的图标色、中间调的说明文字色
    function toneOf(color) {
      const hex = (color || '').trim().replace('#', '');
      const full = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
      const n = parseInt(full, 16);
      if (full.length !== 6 || Number.isNaN(n)) return null;
      const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0;
      if (d) h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h = Math.round(h * 60);
      const l = (max + min) / 2;
      const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
      const sat = Math.round(Math.min(Math.max(s, .16), .6) * 100);
      return { bg: `hsl(${h} ${Math.round(sat * .9)}% 95%)`, ink: `hsl(${h} ${sat}% 32%)`, soft: `hsl(${h} ${Math.round(sat * .75)}% 45%)` };
    }

    function updateReminderCount() {
      const n = deck.children.length;
      if (!n) { reminderHead.remove(); deck.remove(); return; }
      reminderHead.querySelector('b').textContent = `待确认提醒 ${n} 条`;
      // 下面露出来的半张卡占多高，由后面还压着几张决定
      deck.style.setProperty('--peek', n > 2 ? '15px' : n === 2 ? '8px' : '0px');
      if (n < 2) collapseDeck();
    }

    function collapseDeck() {
      deck.classList.remove('expanded');
    }

    calendar.addEventListener('pointerover', event => {
      const bar = event.target.closest('.event');
      if (bar && !locked) showDetail(bar);
    });
    calendar.addEventListener('pointerleave', hideDetail);
    calendar.addEventListener('click', event => {
      const bar = event.target.closest('.event');
      if (!bar) return;
      locked = locked === bar ? null : bar;
      document.querySelectorAll('.event').forEach(item => item.classList.toggle('locked', item === locked));
      if (locked) showDetail(locked); else hideDetail();
    });
    // 点日程以外的任何地方：取消固定，详情收起，窗口缩回去
    document.addEventListener('click', event => {
      if (!locked || event.target.closest('.event') || event.target.closest('.detail-slot')) return;
      locked = null;
      document.querySelectorAll('.event').forEach(item => item.classList.remove('locked'));
      hideDetail();
    });

    deck.addEventListener('click', event => {
      if (event.target.closest('.reminder-ok')) {
        event.stopPropagation();
        const card = event.target.closest('.reminder-card');
        card.remove();
        updateReminderCount();
        return;
      }
      // 只剩一条时没有可展开的东西，点了也不该多出一块空白
      if (deck.children.length < 2) return;
      deck.classList.toggle('expanded');
    });
    updateReminderCount();
    deck.addEventListener('wheel', event => {
      if (deck.classList.contains('expanded') || deck.children.length < 2) return;
      event.preventDefault();
      if (event.deltaY > 0) deck.append(deck.firstElementChild);
      else deck.prepend(deck.lastElementChild);
    }, { passive: false });
  </script>
</body>
</html>
