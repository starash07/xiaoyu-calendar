<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小鱼日程表 · 便当盒主界面提案</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #315873;
      --muted: #8198a8;
      --line: #e7eef2;
      --canvas: #eef3f5;
      --paper: #fbfcfc;
      --blue: #eaf5fb;
      --blue-strong: #78b8db;
      --coral: #ed7f83;
      --coral-soft: #fff0ed;
      --mint: #a8d9c5;
      --yellow: #f4d58a;
      --lavender: #c8c2e9;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 8%, #ffffff 0 3%, transparent 22%),
        linear-gradient(145deg, #edf4f6, #e8edef);
      color: var(--ink);
      font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #5f93b6; outline-offset: 2px; }

    .app {
      width: min(480px, 100vw);
      height: min(720px, 100vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid #dfe9ee;
      border-radius: 16px;
    }

    .topbar {
      height: 48px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .76);
    }

    .fish-mark { display: grid; grid-template-columns: repeat(2, 5px); gap: 3px; transform: rotate(-8deg); }
    .fish-mark i { width: 5px; height: 5px; border-radius: 2px; background: #8bcbe5; }
    .fish-mark i:nth-child(2) { background: #f2aa9d; }
    .fish-mark i:nth-child(3) { background: #f0cf75; }
    .fish-mark i:nth-child(4) { background: #94d1ba; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
    .prototype { color: #9babb5; font-size: 9px; letter-spacing: .5px; }
    .spacer { flex: 1; }
    .icon-button {
      width: 29px; height: 29px; display: grid; place-items: center; padding: 0;
      border: 0; border-radius: 9px; background: transparent; color: #6d8a9d;
    }
    .icon-button:hover { background: var(--blue); }
    .icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 16px 16px;
      scrollbar-width: thin;
      scrollbar-color: #cbdce5 transparent;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { border-radius: 4px; background: #cbdce5; }

    /* 顶部只有提醒卡片本身，没有提醒栏外壳。 */
    .reminder-deck { position: relative; height: 56px; margin: 0 2px 11px; }
    .reminder-card {
      position: absolute;
      inset: 0;
      z-index: 3;
      min-height: 46px;
      display: grid;
      grid-template-columns: 6px minmax(0, 1fr) auto;
      grid-template-rows: 16px 16px;
      gap: 0 8px;
      align-items: center;
      padding: 7px 10px;
      border: 0;
      border-radius: 12px;
      background: var(--coral);
      transform-origin: top center;
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), opacity .2s ease;
    }
    .reminder-card:nth-child(2) { z-index: 2; opacity: .32; transform: translateY(5px) scale(.982); }
    .reminder-card:nth-child(3) { z-index: 1; opacity: .14; transform: translateY(10px) scale(.962); }
    .reminder-card:nth-child(n+2) > * { opacity: 0; }
    .reminder-dot { width: 6px; height: 6px; border-radius: 50%; grid-row: 1 / 3; background: rgba(255,255,255,.86) !important; }
    .reminder-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff; font-size: 11px; line-height: 16px; font-weight: 600; text-align: center; }
    .reminder-reason { align-self: end; color: rgba(255,255,255,.8); font-size: 9px; line-height: 17px; text-align: center; }
    .reminder-ok { grid-column: 3; grid-row: 1 / 3; align-self: center; min-height: 22px; padding: 0 8px; border: 0; border-radius: 7px; background: rgba(255,255,255,.9); color: #aa555a; font-size: 9px; line-height: 22px; }
    .reminder-deck.expanded { height: auto; display: grid; gap: 7px; }
    .reminder-deck.expanded .reminder-card { position: relative; opacity: 1; transform: none; min-height: 46px; }
    .reminder-deck.expanded .reminder-card > * { opacity: 1; }
    .reminder-deck.expanded .reminder-count { display: none; }

    /* 月历固定 6:5，由宽度决定高度，不随窗口剩余空间拉伸。 */
    .calendar-card {
      width: 100%;
      aspect-ratio: 6 / 5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 11px 10px 9px;
      border-radius: 14px;
      background: #f7fafb;
    }
    .weekdays {
      height: 27px;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: start;
      color: #7594a8;
      font-size: 11px;
      text-align: center;
    }
    .weekdays span:nth-child(n+6) { color: #d88389; }
    .month-grid { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(6, 1fr); }
    .week { position: relative; min-height: 0; border-top: 1px solid var(--line); }
    .dates { height: 27px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; }
    .day {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 27px;
      color: #416f8d;
      font: 14px/1 "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    .day.weekend { color: #dc7c83; }
    .day.out { color: #bbc7ce; }
    .day.today span { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; background: var(--coral); color: #fff; font-weight: 600; }
    .event-layer { position: absolute; inset: 29px 0 auto; height: 20px; pointer-events: none; }
    .event {
      --start: 0;
      --span: 1;
      position: absolute;
      left: calc(var(--start) * 100% / 7 + 2px);
      width: calc(var(--span) * 100% / 7 - 4px);
      height: 19px;
      overflow: hidden;
      padding: 0 6px;
      border: 0;
      border-radius: 5px;
      background: var(--event-color, var(--mint));
      color: #315a53;
      font-size: 11px;
      line-height: 19px;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
      pointer-events: auto;
      transition: filter .15s ease, transform .15s ease;
    }
    .event:hover, .event.hot { filter: brightness(.98) saturate(1.08); transform: translateY(-1px); }
    .event.locked::before { content: "◆"; margin-right: 4px; font-size: 7px; }

    .detail-slot { max-height: 0; margin-top: 0; overflow: hidden; opacity: 0; transition: max-height .24s cubic-bezier(.22, 1, .36, 1), margin .24s ease, opacity .16s ease; }
    .detail-slot.show { max-height: 94px; margin-top: 10px; opacity: 1; }
    .detail-card {
      min-height: 78px;
      display: grid;
      grid-template-columns: 4px minmax(0, 1fr) auto;
      gap: 3px 10px;
      align-items: start;
      padding: 11px 12px;
      border-radius: 12px;
      background: #edf7f4;
    }
    .detail-line { grid-row: 1 / 4; width: 4px; align-self: stretch; border-radius: 4px; background: var(--mint); }
    .detail-title { font-size: 12px; font-weight: 700; }
    .detail-meta { color: #6f8b94; font-size: 10px; }
    .detail-note { color: #56727c; font-size: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .detail-lock { grid-column: 3; grid-row: 1 / 3; padding: 2px 7px; border: 0; border-radius: 7px; background: rgba(255,255,255,.75); color: #65848b; font-size: 9px; }

    /* 月份和操作全部在月历下方。 */
    .bottom-bento { height: 88px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(118px, .8fr); gap: 10px; margin-top: 10px; }
    .month-tile {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr auto;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--blue);
    }
    .month-kicker { color: #7192a7; font: 9px/1.4 "Segoe UI", sans-serif; letter-spacing: 1.7px; }
    .month-name { align-self: center; font-size: 27px; line-height: 1; font-weight: 500; color: #3f7598; }
    .month-name small { margin-left: 3px; font-size: 15px; font-weight: 400; }
    .month-count { color: #7a96a7; font-size: 9px; }
    .month-nav { grid-column: 2; grid-row: 1; align-self: start; display: flex; gap: 4px; }
    .month-nav button { width: 27px; height: 25px; padding: 0; border: 0; border-radius: 8px; background: rgba(255,255,255,.66); color: #5b819a; font-size: 15px; }
    .quick-actions { display: grid; grid-template-rows: 1fr 1.15fr; gap: 8px; }
    .today-button, .new-button { border: 0; border-radius: 12px; }
    .today-button { background: #f1f5f7; color: #658195; font-size: 11px; }
    .new-button { background: #fff4e9; color: #aa6048; font-size: 11px; font-weight: 700; }
    .new-button span { margin-right: 4px; font-size: 16px; font-weight: 400; }
    .range-button { position: absolute; right: 12px; bottom: 9px; border: 0; background: none; color: #7b96a6; font-size: 9px; text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 420px) {
      .app { border-radius: 12px; }
      .content { padding-left: 12px; padding-right: 12px; }
      .prototype { display: none; }
      .day { font-size: 13px; }
      .calendar-card { padding-left: 7px; padding-right: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="小鱼日程表主界面设计提案">
    <header class="topbar">
      <span class="fish-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand">小鱼日程表</span>
      <span class="prototype">便当盒提案</span>
      <span class="spacer"></span>
      <button class="icon-button" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/></svg>
      </button>
      <button class="icon-button" type="button" aria-label="收起窗口" title="收起窗口">
        <svg viewBox="0 0 24 24"><path d="m7 7 10 10M7 17 17 7"/></svg>
      </button>
    </header>

    <div class="content">
      <section class="reminder-deck" id="reminderDeck" aria-label="待确认提醒">
        <article class="reminder-card" tabindex="0">
          <i class="reminder-dot" style="background:#74badd"></i>
          <div class="reminder-title">新界面设计</div>
          <div class="reminder-reason">2 天后截止</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
        <article class="reminder-card" tabindex="0">
          <i class="reminder-dot" style="background:#a7d8c5"></i>
          <div class="reminder-title">完成本月复盘</div>
          <div class="reminder-reason">6 天后开始</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
        <article class="reminder-card" tabindex="0">
          <i class="reminder-dot" style="background:#f1cc76"></i>
          <div class="reminder-title">周末出游</div>
          <div class="reminder-reason">明天开始</div>
          <button class="reminder-ok" type="button">知道了</button>
        </article>
      </section>

      <section class="calendar-card" id="calendar" aria-label="2026 年 9 月月历">
        <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="month-grid">
          <div class="week">
            <div class="dates"><div class="day out">31</div><div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div><div class="day weekend">5</div><div class="day weekend">6</div></div>
            <div class="event-layer"><button class="event" style="--start:3;--span:4;--event-color:#c8c2e9" data-title="阅读 · 一本新书" data-date="9月3日—9月6日" data-note="晚上读半小时，周末整理摘录。" data-color="#aaa2dc">阅读 · 一本新书</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">7</div><div class="day">8</div><div class="day">9</div><div class="day">10</div><div class="day">11</div><div class="day weekend">12</div><div class="day weekend">13</div></div>
            <div class="event-layer"><button class="event" style="--start:0;--span:4;--event-color:#a8d9c5" data-title="项目方案整理" data-date="9月7日—9月10日" data-note="把需求、交互和剩余问题整理成一份清单。" data-color="#73bfa1">项目方案整理</button><button class="event" style="--start:5;--span:2;--event-color:#f6c9ad" data-title="和朋友吃饭" data-date="9月12日" data-note="晚餐，出发前确认餐厅。" data-color="#efad81">和朋友吃饭</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">14</div><div class="day">15</div><div class="day">16</div><div class="day">17</div><div class="day today"><span>18</span></div><div class="day weekend">19</div><div class="day weekend">20</div></div>
            <div class="event-layer"><button class="event" style="--start:0;--span:7;--event-color:#abd5e8" data-title="新界面设计" data-date="9月14日—9月20日" data-note="主界面改成固定比例月历与扁平便当盒结构。" data-color="#78b8db">新界面设计</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day weekend">26</div><div class="day weekend">27</div></div>
            <div class="event-layer"><button class="event" style="--start:3;--span:3;--event-color:#a8d9c5" data-title="完成本月复盘" data-date="9月24日—9月26日" data-note="回顾本月完成的事项和下月计划。" data-color="#73bfa1">完成本月复盘</button></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day">28</div><div class="day">29</div><div class="day">30</div><div class="day out">1</div><div class="day out">2</div><div class="day out weekend">3</div><div class="day out weekend">4</div></div>
          </div>
          <div class="week">
            <div class="dates"><div class="day out">5</div><div class="day out">6</div><div class="day out">7</div><div class="day out">8</div><div class="day out">9</div><div class="day out weekend">10</div><div class="day out weekend">11</div></div>
          </div>
        </div>
      </section>

      <section class="detail-slot" id="detailSlot" aria-live="polite">
        <div class="detail-card">
          <i class="detail-line" id="detailLine"></i>
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-note" id="detailNote"></div>
          <button class="detail-lock" id="detailLock" type="button">点击固定</button>
        </div>
      </section>

      <section class="bottom-bento" aria-label="月份和快捷操作">
        <div class="month-tile">
          <div class="month-kicker">2026 / SEPTEMBER</div>
          <div class="month-name">9<small>月</small></div>
          <div class="month-count">本月 9 项日程</div>
          <div class="month-nav"><button type="button" title="上一月">‹</button><button type="button" title="下一月">›</button></div>
          <button class="range-button" type="button">选日期</button>
        </div>
        <div class="quick-actions">
          <button class="today-button" type="button">今天</button>
          <button class="new-button" type="button"><span>＋</span>新建日程</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const deck = document.getElementById('reminderDeck');
    const calendar = document.getElementById('calendar');
    const detailSlot = document.getElementById('detailSlot');
    const detailTitle = document.getElementById('detailTitle');
    const detailMeta = document.getElementById('detailMeta');
    const detailNote = document.getElementById('detailNote');
    const detailLine = document.getElementById('detailLine');
    const detailLock = document.getElementById('detailLock');
    let locked = null;

    function showDetail(bar) {
      document.querySelectorAll('.event').forEach(item => item.classList.toggle('hot', item === bar));
      detailTitle.textContent = bar.dataset.title;
      detailMeta.textContent = bar.dataset.date;
      detailNote.textContent = bar.dataset.note;
      detailLine.style.background = bar.dataset.color;
      detailSlot.classList.add('show');
      detailLock.textContent = locked === bar ? '取消固定' : '点击固定';
    }

    function hideDetail() {
      if (locked) return;
      document.querySelectorAll('.event').forEach(item => item.classList.remove('hot'));
      detailSlot.classList.remove('show');
    }

    calendar.addEventListener('pointerover', event => {
      const bar = event.target.closest('.event');
      if (bar && !locked) showDetail(bar);
    });
    calendar.addEventListener('pointerleave', hideDetail);
    calendar.addEventListener('click', event => {
      const bar = event.target.closest('.event');
      if (!bar) return;
      locked = locked === bar ? null : bar;
      document.querySelectorAll('.event').forEach(item => item.classList.toggle('locked', item === locked));
      if (locked) showDetail(locked); else hideDetail();
    });
    detailLock.addEventListener('click', () => {
      if (!locked) {
        const hot = document.querySelector('.event.hot');
        if (hot) locked = hot;
      } else locked = null;
      document.querySelectorAll('.event').forEach(item => item.classList.toggle('locked', item === locked));
      if (locked) showDetail(locked); else hideDetail();
    });

    deck.addEventListener('click', event => {
      if (event.target.closest('.reminder-ok')) {
        event.stopPropagation();
        const card = event.target.closest('.reminder-card');
        card.remove();
        if (!deck.children.length) deck.remove();
        return;
      }
      deck.classList.toggle('expanded');
    });
    deck.addEventListener('wheel', event => {
      if (deck.classList.contains('expanded') || deck.children.length < 2) return;
      event.preventDefault();
      if (event.deltaY > 0) deck.append(deck.firstElementChild);
      else deck.prepend(deck.lastElementChild);
    }, { passive: false });
  </script>
</body>
</html>
