<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小鱼日程表 · 桌面钉住效果模拟</title>
  <style>
    :root { color-scheme: light; font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: #35566b; background: #fff; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 20px 24px 14px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid #7e72b4; outline-offset: 4px; }
    button { color: inherit; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 16px; }
    .identity { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .fish { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; transform: rotate(-8deg); }
    .fish i { width: 6px; height: 6px; border-radius: 2px; background: #91cbe1; }
    .fish i:nth-child(2) { background: #f0aa9b; }
    .fish i:nth-child(3) { background: #eace83; }
    .fish i:nth-child(4) { background: #9fcfba; }
    .identity strong { display: block; font-size: 14px; letter-spacing: 1px; font-weight: 600; }
    .identity small { display: block; color: #8497a3; font-size: 11px; margin-top: 1px; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .wall-options { display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: #f0f4f6; }
    .wall-options button, .tool { border: 0; min-height: 32px; padding: 0 10px; border-radius: 7px; background: transparent; white-space: nowrap; font-size: 12px; }
    .wall-options button { color: #718794; }
    .wall-options button[aria-pressed="true"] { background: #fff; color: #385c74; box-shadow: 0 1px 3px #1b456610; }
    .tool { background: #f2f6f8; }
    .tool:hover, .tool[aria-pressed="true"] { background: #e8eff4; }
    .tool.placement { color: #426e70; background: #e7f2ee; }
    .tool.placement[aria-pressed="false"] { background: #fff1df; color: #956c42; }
    .adjustments { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 17px 26px; padding: 3px 2px 19px; }
    .adjustments label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px 12px; color: #617b8c; font-size: 12px; }
    .adjustments output { color: #35566b; font-variant-numeric: tabular-nums; }
    .adjustments input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #8f82bb; }
    .adjustments input[type="color"] { width: 36px; height: 27px; padding: 2px; border: 1px solid #dce5eb; border-radius: 6px; background: #fff; }
    .adjustments select { grid-column: 1 / -1; width: 100%; height: 30px; border: 1px solid #dce5eb; border-radius: 6px; background: #fff; color: #456479; }
    .desktop {
      --sky-top: #b6cbd4; --sky-low: #e2e6dc; --sun: #f8ead1; --far: #9cb7bd;
      --middle: #89aab4; --near: #7597a6; --front: #648695; --icon-ink: #fff;
      height: max(640px, calc(100vh - 135px)); min-height: var(--scene-height, 640px);
      position: relative; isolation: isolate; overflow: hidden; border-radius: 14px;
      background: var(--sky-top); user-select: none;
    }
    .desktop[data-wallpaper="sand"] { --sky-top: #d3d9d2; --sky-low: #efeadf; --sun: #fff6e0; --far: #c6cbbb; --middle: #b9bca7; --near: #a4b09f; --front: #8fa294; }
    .desktop[data-wallpaper="night"] { --sky-top: #25364f; --sky-low: #8b95a4; --sun: #eee4d6; --far: #667b94; --middle: #50657f; --near: #3c526e; --front: #2c435e; }
    .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .geometry-art { display: none; }
    .desktop[data-wallpaper="sand"] .landscape-art { display: none; }
    .desktop[data-wallpaper="sand"] .geometry-art { display: inline; }
    .custom-wallpaper { position: absolute; inset: 0; background-position: center; background-size: cover; pointer-events: none; }
    .desktop-icons { position: absolute; left: 14px; top: 22px; z-index: 5; display: grid; gap: 19px; width: 78px; pointer-events: none; }
    .desktop-icon { display: grid; justify-items: center; gap: 6px; font-size: 11px; color: var(--icon-ink); text-align: center; text-shadow: 0 1px 4px #18354877; }
    .desktop-icon svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 2px #36536920); }
    .widget {
      --panel-fill: rgb(255 255 255 / .14); --text: #315873; --soft: #607e8d;
      --weekend: #8a70d6; --weekend-out: #b7acd7; --date-size: 17px; --week-height: 54px;
      --glass-blur: 14px; --today-fill: #c5e5d8; --today-ink: #427e68;
      position: absolute; z-index: 2; top: 44px; right: 36px; width: 420px; max-width: calc(100% - 32px);
      padding: 18px 17px 15px; border: 1px solid #ffffff52; border-top-color: #ffffffa6; border-bottom-color: #ffffff33; border-radius: 15px;
      color: var(--text); background-color: var(--panel-fill);
      background-image: linear-gradient(135deg, #ffffff24 0%, #ffffff0a 38%, #ffffff00 68%, #ffffff0d 100%);
      backdrop-filter: blur(var(--glass-blur)) saturate(115%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(115%);
      box-shadow: 0 8px 28px #254b6214, inset 0 1px 0 #ffffff33, inset 0 -1px 0 #ffffff0d;
      transition: background-color .18s, border-color .18s;
    }
    .widget.loose { z-index: 7; outline: 1.5px dashed #477a92a6; outline-offset: 4px; }
    .widget.dragging { cursor: grabbing; }
    .loose-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -6px -5px 12px; padding: 5px 9px; border-radius: 8px; background: #ffffff8f; color: #557485; font-size: 11px; cursor: grab; touch-action: none; }
    .loose-bar button { padding: 4px 11px; border: 0; border-radius: 6px; background: #dceee6; color: #3d7362; font-size: 11px; }
    .widget-head { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; min-height: 25px; padding: 0 3px; }
    .month-heading { display: flex; align-items: baseline; gap: 9px; }
    .month-heading strong { font-size: 20px; line-height: 1; font-weight: 500; letter-spacing: .5px; }
    .month-heading span { font-size: 11px; color: var(--soft); letter-spacing: 1.2px; }
    .reminder-flag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 8px; color: #a87952; background: #fff2dfba; font-size: 11px; }
    .reminder-flag svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flag-tip { position: absolute; z-index: 10; top: 33px; right: 0; padding: 8px 11px; border-radius: 9px; background: #fffaf4; box-shadow: 0 3px 15px #21435915; color: #8e6b4b; font-size: 11px; pointer-events: none; }
    .flag-tip span { display: block; margin-top: 2px; color: #a58c75; }
    .weekdays, .dates { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
    .weekdays { height: 27px; color: var(--soft); font-size: 11px; }
    .weekdays span:nth-child(n+6) { color: var(--weekend); font-weight: 500; }
    .week { position: relative; min-height: var(--week-height); padding: 6px 0 8px; border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent); }
    .dates { height: 28px; align-items: center; }
    .day { height: 28px; display: grid; place-items: center; font: var(--date-size)/1 Bahnschrift, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    /* 统一数字的定位框，并补偿字体略偏上的视觉重心；圆底保持原位。 */
    .day span { display: grid; place-items: center; width: 28px; height: 28px; padding-top: 2px; }
    .day.weekend { color: var(--weekend); font-weight: 500; }
    .day.out { color: color-mix(in srgb, var(--text) 32%, transparent); }
    .day.out.weekend { color: var(--weekend-out); }
    .day.today span {
      position: relative; isolation: isolate; border-radius: 50%;
      background: var(--today-fill); color: var(--today-ink);
      box-shadow: 2px 3px 6px #315f5233, -1px -1px 4px #eafff36b;
    }
    /* 只借用参考图的柔和凸起与透光边缘，底色、反光、阴影均保持薄荷绿系。 */
    .day.today span::before, .day.today span::after {
      content: ""; position: absolute; z-index: -1; pointer-events: none;
    }
    .day.today span::before {
      inset: 0; border-radius: inherit;
      background: radial-gradient(ellipse at 18% 20%, #d5f5e6bb 0%, #d5f5e600 64%),
        radial-gradient(ellipse at 76% 30%, #add9c38a 0%, #add9c300 68%),
        linear-gradient(145deg, #bfe3d2 0%, #d4ecdf 58%, #e4f5e9 100%);
      box-shadow: inset 1px 1px 1px #8ebfa54d, inset -1px -1px 1.5px #edfff2d9;
    }
    .day.today span::after {
      inset: 1px; border-radius: inherit;
      background: linear-gradient(120deg, #effff42b 0%, #effff400 48%, #dffff054 80%, #effff48c 100%);
      filter: blur(.3px); opacity: .65; transition: opacity .24s ease-out;
    }
    .day.today:hover span::after {
      opacity: .9;
    }
    .lanes { position: relative; margin-top: 6px; height: calc(var(--lanes) * 20px - 5px); }
    .lanes.empty { height: 0; margin: 0; }
    .event { position: absolute; top: calc(var(--lane) * 20px); height: 15px; padding: 0 7px; line-height: 15px; font-size: 10px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--event-color); color: #345662; cursor: default; transition: transform .16s, filter .16s; }
    .event.hot { transform: translateY(-1px); filter: saturate(1.18); }
    .event.continues-before { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .event.continues-after { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .details-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: 0; transition: grid-template-rows .24s cubic-bezier(.22, 1, .36, 1), opacity .18s, margin-top .24s; }
    .details-wrap.show { grid-template-rows: 1fr; opacity: 1; margin-top: 13px; }
    .details-clip { min-height: 0; overflow: hidden; }
    .detail-content { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 10px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--text) 14%, transparent); }
    .detail-stripe { border-radius: 3px; background: var(--detail-color); }
    .detail-title { margin: 0; font-size: 12px; font-weight: 600; word-break: break-word; }
    .detail-date, .detail-note { margin-top: 4px; color: var(--soft); font-size: 11px; }
    .detail-note { white-space: pre-wrap; word-break: break-word; }
    .work-window { position: absolute; z-index: 20; left: 21%; top: 24%; width: 58%; min-width: 270px; max-width: 620px; background: #fafcfd; border: 1px solid #d7e1e6; border-radius: 10px; box-shadow: 0 18px 60px #15334638; overflow: hidden; }
    .work-head { display: flex; align-items: center; padding: 0 0 0 16px; min-height: 41px; border-bottom: 1px solid #e5ecf0; background: #fff; cursor: grab; touch-action: none; }
    .work-head strong { font-size: 12px; font-weight: 500; margin-right: auto; }
    .work-head button { width: 42px; height: 40px; border: 0; background: transparent; color: #748895; }
    .work-head button:hover { color: #a95b5b; background: #fbefec; }
    .work-body { padding: 23px; min-height: 230px; }
    .work-address { color: #758b97; font-size: 11px; padding-bottom: 18px; }
    .files { display: flex; flex-wrap: wrap; gap: 22px; }
    .file { display: grid; justify-items: center; gap: 9px; min-width: 66px; color: #657c8b; font-size: 11px; }
    .folder { width: 46px; height: 34px; border-radius: 3px 5px 5px 5px; background: #f1cf81; position: relative; margin-top: 7px; }
    .folder::before { content: ""; position: absolute; left: 0; top: -5px; width: 22px; height: 9px; border-radius: 4px 5px 0 0; background: #dfbb6e; }
    .taskbar { position: absolute; inset: auto 0 0; z-index: 30; height: 46px; display: flex; align-items: center; justify-content: center; background: #edf3f5bd; backdrop-filter: blur(18px); border-top: 1px solid #ffffff3d; }
    .task-apps { display: flex; align-items: center; gap: 22px; }
    .windows-logo { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .windows-logo i { background: #529ec7; }
    .task-folder { width: 25px; height: 19px; border-radius: 3px; background: #ebc77a; box-shadow: inset 0 5px #f5db96; }
    .browser-logo { width: 23px; height: 23px; border-radius: 50%; background: conic-gradient(#72c6cb, #4b9bd0, #77c8cb, #b2e4c5, #72c6cb); box-shadow: inset 0 0 0 7px #ffffff28; }
    .taskbar-clock { position: absolute; right: 17px; text-align: right; color: #4a6475; font-size: 10px; font-variant-numeric: tabular-nums; line-height: 1.6; }
    .taskbar-clock time { display: block; }
    .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px 20px; padding: 10px 3px 0; color: #80939f; font-size: 11px; }
    .state { color: #648b80; }
    .state::before { content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 7px; border-radius: 50%; background: #8abcab; vertical-align: 1px; }
    @media (max-width: 850px) { .toolbar { gap: 13px; } .identity { flex: 1; } .adjustments { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { body { padding: 14px 12px 10px; } .tools { width: 100%; } .desktop-icons { left: 9px; top: 14px; width: 59px; gap: 16px; } .desktop-icon svg { width: 28px; height: 28px; } .desktop-icon { font-size: 10px; } .work-window { left: 16px; min-width: 0; width: calc(100% - 32px); } .taskbar-clock { right: 10px; } .task-apps { gap: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="identity"><span class="fish" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong>小鱼日程表</strong><small>桌面钉住效果 · 磨砂玻璃</small></div></div>
    <div class="tools">
      <div class="wall-options" aria-label="壁纸场景">
        <button type="button" data-wallpaper="mist" aria-pressed="false">雾蓝</button>
        <button type="button" data-wallpaper="sand" aria-pressed="true">几何</button>
        <button type="button" data-wallpaper="night" aria-pressed="false">暮色</button>
      </div>
      <button class="tool" id="wallpaperBtn" type="button">自己的壁纸</button>
      <input type="file" id="wallpaperFile" accept="image/*" hidden>
      <button class="tool" id="appearanceBtn" type="button" aria-expanded="false" aria-controls="adjustments">调整外观</button>
      <button class="tool" id="coverBtn" type="button" aria-pressed="false">模拟工作窗口</button>
      <button class="tool placement" id="placementBtn" type="button" aria-pressed="true">解锁摆放</button>
    </div>
  </header>
  <section class="adjustments" id="adjustments" aria-label="桌面效果调节" hidden>
    <label>玻璃不透明度<output id="opacityValue" for="opacityRange">14%</output><input id="opacityRange" aria-label="玻璃不透明度" type="range" min="0" max="100" step="1" value="14"></label>
    <label>挂件宽度<output id="widthValue" for="widthRange">420px</output><input id="widthRange" aria-label="挂件宽度" type="range" min="320" max="600" step="10" value="420"></label>
    <label>日期字号<output id="fontValue" for="fontRange">17px</output><input id="fontRange" aria-label="日期字号" type="range" min="13" max="22" step="1" value="17"></label>
    <label>磨砂强度<output id="blurValue" for="blurRange">14px</output><input id="blurRange" aria-label="磨砂强度" type="range" min="0" max="40" step="1" value="14"></label>
    <label>玻璃底色<input id="panelColor" aria-label="玻璃底色" type="color" value="#ffffff"></label>
    <label>文字颜色<input id="textColor" aria-label="文字颜色" type="color" value="#315873"></label>
    <label>周末颜色<input id="weekendColor" aria-label="周末颜色" type="color" value="#8a70d6"></label>
    <label>示例日程<select id="density" aria-label="示例日程数量"><option value="few">少量</option><option value="normal" selected>适中 · 含两三条叠放</option><option value="many">密集</option><option value="empty">无日程</option></select></label>
  </section>
  <main class="desktop" id="desktop" data-wallpaper="sand" aria-label="模拟的 Windows 桌面">
    <svg class="wallpaper" id="wallpaper" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--sky-top)"/><stop offset="1" stop-color="var(--sky-low)"/></linearGradient>
        <radialGradient id="glow"><stop stop-color="var(--sun)" stop-opacity=".75"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
        <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--sky-low)" stop-opacity="0"/><stop offset="1" stop-color="var(--sky-low)" stop-opacity=".26"/></linearGradient>
        <pattern id="glass-wallpaper-lines" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
          <path d="M0 0V44" fill="none" stroke="#fff6e8" stroke-width="6" opacity=".65"/>
        </pattern>
        <pattern id="glass-wallpaper-grid" width="104" height="104" patternUnits="userSpaceOnUse">
          <path d="M104 0H0V104" fill="none" stroke="#fff8ee" stroke-width="3" opacity=".6"/>
        </pattern>
      </defs>
      <g class="landscape-art">
      <path fill="url(#sky)" d="M0 0h1600v1000H0z"/>
      <ellipse cx="440" cy="225" rx="570" ry="490" fill="url(#glow)"/>
      <circle cx="420" cy="254" r="39" fill="var(--sun)" opacity=".5"/>
      <path fill="var(--far)" opacity=".65" d="M0 620Q120 550 250 470T490 512Q600 550 742 463T1030 507Q1260 370 1600 500V1000H0Z"/>
      <path fill="var(--middle)" opacity=".8" d="M0 657Q230 520 485 641T960 590Q1250 493 1600 683V1000H0Z"/>
      <path fill="var(--near)" d="M0 804Q180 645 463 733T944 748Q1240 612 1600 804V1000H0Z"/>
      <path fill="var(--front)" d="M0 930Q310 770 605 890T1170 859Q1410 790 1600 900V1000H0Z"/>
      <path fill="url(#haze)" d="M0 0h1600v1000H0z"/>
      </g>
      <g class="geometry-art">
        <path fill="#eddfbf" d="M0 0h1600v1000H0z"/>
        <path fill="#d39486" d="M0 0h1050L330 1000H0Z"/>
        <path fill="#e7b968" d="M0 640 490 0h340L110 1000H0Z"/>
        <path fill="url(#glass-wallpaper-lines)" d="M0 640 490 0h340L110 1000H0Z"/>
        <path fill="#75afa5" d="M940 0h370L590 1000H220Z"/>
        <path fill="#418f86" d="M1130 0h160L570 1000H410Z"/>
        <path fill="#a29bcc" d="M1600 185v815H865Z"/>
        <path fill="url(#glass-wallpaper-grid)" d="M1600 185v815H865Z"/>
        <path fill="#f5e9d2" d="m885 210 82-114 465 420-82 114Z"/>
        <path fill="#e7b968" d="m931 146 16-22 465 420-16 22Z"/>
        <circle cx="1175" cy="735" r="106" fill="#f2c98e"/>
        <circle cx="1175" cy="735" r="79" fill="none" stroke="#f9edda" stroke-width="4"/>
        <path fill="#f5e9d2" d="M0 897 281 1000H0Z"/>
      </g>
    </svg>
    <div class="custom-wallpaper" id="customWallpaper" hidden></div>
    <div class="desktop-icons" aria-hidden="true">
      <div class="desktop-icon"><svg viewBox="0 0 40 40"><path fill="#eaf4f6" stroke="#b2cfdb" d="m10 9 2 27h17l2-27Z"/><path fill="#d5e8ef" d="M8 6h25v5H8zM15 3h11v4H15z"/><path fill="none" stroke="#85bdc8" stroke-width="2" d="m17 16-3 6h5m7-1-3-5m0 6-3 5h6"/></svg><span>回收站</span></div>
      <div class="desktop-icon"><svg viewBox="0 0 40 40"><rect x="3" y="6" width="34" height="23" rx="2" fill="#dceaf0"/><rect x="6" y="9" width="28" height="17" rx="1" fill="#86bad0"/><path fill="#dceaf0" d="M17 29h6v5h7v3H10v-3h7Z"/></svg><span>此电脑</span></div>
      <div class="desktop-icon"><svg viewBox="0 0 40 40"><path fill="#d9ba71" d="M4 9a3 3 0 0 1 3-3h11l4 5h13v24H4Z"/><path fill="#f3d690" d="M3 13h34l-2 21H5Z"/></svg><span>工作</span></div>
      <div class="desktop-icon"><svg viewBox="0 0 40 40"><rect x="6" y="3" width="28" height="34" rx="4" fill="#f3f1ed"/><rect x="10" y="7" width="20" height="19" rx="2" fill="#b8d0ca"/><circle cx="24" cy="12" r="3" fill="#f4e3b0"/><path fill="#7eaaa3" d="m10 24 7-10 6 8 3-4 4 6Z"/><path stroke="#c8d1d5" stroke-width="2" d="M12 31h16"/></svg><span>灵感</span></div>
    </div>
    <section class="widget" id="widget" aria-label="已钉住的桌面日历">
      <div class="loose-bar" id="dragHandle" hidden><span>拖动摆放位置</span><button id="pinBtn" type="button">钉住</button></div>
      <header class="widget-head">
        <div class="month-heading"><strong id="monthTitle"></strong><span id="yearTitle"></span></div>
        <div class="reminder-flag" id="reminderFlag" tabindex="0" aria-label="有三条待确认提醒，请到主窗口查看" aria-describedby="flagTip"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0v4l2 3H3l2-3ZM8 17h4"/></svg><span>3</span></div>
        <div class="flag-tip" id="flagTip" role="tooltip" hidden>有 3 条待确认提醒<span>请到主窗口查看</span></div>
      </header>
      <div id="calendar"></div>
      <section class="details-wrap" id="details" aria-label="日程详情" aria-hidden="true">
        <div class="details-clip"><div class="detail-content"><i class="detail-stripe" aria-hidden="true"></i><div><h2 class="detail-title" id="detailTitle"></h2><div class="detail-date" id="detailDate"></div><div class="detail-note" id="detailNote"></div></div></div></div>
      </section>
    </section>
    <section class="work-window" id="workWindow" aria-label="模拟工作窗口" hidden>
      <header class="work-head" id="workDrag"><strong>工作文件 · 示例窗口</strong><button id="closeWork" type="button" aria-label="关闭示例窗口">✕</button></header>
      <div class="work-body"><div class="work-address">此电脑　/　工作</div><div class="files"><div class="file"><span class="folder"></span>设计稿</div><div class="file"><span class="folder"></span>参考图片</div><div class="file"><span class="folder"></span>待整理</div></div></div>
    </section>
    <div class="taskbar" aria-hidden="true"><div class="task-apps"><span class="windows-logo"><i></i><i></i><i></i><i></i></span><span class="task-folder"></span><span class="browser-logo"></span><span class="fish"><i></i><i></i><i></i><i></i></span></div><div class="taskbar-clock"><time id="clock"></time><span id="desktopDate"></span></div></div>
  </main>
  <footer class="footer"><span class="state" id="stateLabel" role="status">已钉住 · 悬停日程查看详情</span><span>桌面效果模拟 · 使用示例日程</span></footer>
  <script>
    const $ = id => document.getElementById(id);
    const scene = $('desktop'), widget = $('widget'), calendar = $('calendar');
    const now = new Date(), year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
    const dayTime = n => Date.UTC(year, month, n);
    const dayNumber = time => Math.round(time / 86400000);
    const dateText = time => { const d = new Date(time); return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`; };
    const monthDays = new Date(year, month + 1, 0).getDate();
    const gridOffset = (new Date(year, month, 1).getDay() + 6) % 7;
    const gridStart = dayNumber(dayTime(1 - gridOffset));
    const weeks = Math.ceil((gridOffset + monthDays) / 7);
    const sampleRows = [
      ['阅读 · 一本新书', 2, 6, '#c8c2e9', '每天读一点，周末整理喜欢的句子。'],
      ['项目方案整理', 7, 12, '#a8d9c5', '梳理需求，整理参考资料。\n给修改和讨论留一点时间。'],
      ['资料核对', 9, 11, '#f2c5ae', '把材料逐项核对，确认最终版本。'],
      ['新界面设计', 14, 20, '#abd5e8', '试试更清爽的桌面日历。\n日程多的时候，整周自然增高。'],
      ['双周迭代', 16, 18, '#c8c2e9', '周五一起看看这一版的实际效果。'],
      ['和朋友见面', 18, 18, '#f4d58a', '下午出门，记得带上相机。'],
      ['完成本月复盘', 24, 26, '#a8d9c5', '回顾本月完成的事情，慢慢安排下个月。'],
    ];
    const allTasks = sampleRows.map(([title, start, end, color, note], i) => ({ id: `task-${i}`, title,
      start: dayNumber(dayTime(start)), end: dayNumber(dayTime(end)), color, note }));
    let activeTasks = [], pinned = true, dragging = null, shownId = null, detailTimer = 0;
    let widgetPosition = null, customUrl = null;
    $('monthTitle').textContent = `${month + 1} 月`;
    $('yearTitle').textContent = `${year}`;

    function fitScene() {
      const desiredTop = Math.max(18, widgetPosition ? widgetPosition.y : 44);
      const minHeight = Math.max(640, Math.ceil(widget.offsetHeight) + desiredTop + 64);
      const heightValue = `${minHeight}px`;
      if (scene.style.getPropertyValue('--scene-height') !== heightValue) scene.style.setProperty('--scene-height', heightValue);
      const maxX = Math.max(16, scene.clientWidth - widget.offsetWidth - 16);
      const maxY = Math.max(18, scene.clientHeight - widget.offsetHeight - 64);
      const x = Math.max(16, Math.min(widgetPosition ? widgetPosition.x : maxX - 20, maxX));
      const y = Math.max(18, Math.min(desiredTop, maxY));
      widget.style.left = `${x}px`; widget.style.top = `${y}px`; widget.style.right = 'auto';
    }
    new ResizeObserver(() => {
      const weekHeight = `${Math.max(54, Math.round(calendar.clientWidth * .135))}px`;
      if (widget.style.getPropertyValue('--week-height') !== weekHeight) widget.style.setProperty('--week-height', weekHeight);
      fitScene();
    }).observe(widget);
    new ResizeObserver(fitScene).observe(scene);

    function renderCalendar() {
      const density = $('density').value;
      activeTasks = density === 'empty' ? [] : density === 'few' ? [allTasks[1], allTasks[3], allTasks[6]] : [...allTasks];
      if (density === 'many') for (let i = 0; i < 7; i++) activeTasks.push({
        id: `extra-${i}`, title: ['内容整理', '设计评审', '素材归档', '修改意见', '准备交付', '进度检查', '补充资料'][i],
        start: dayNumber(dayTime(14 + i % 3)), end: dayNumber(dayTime(18 + i % 3)),
        color: ['#c8c2e9', '#a8d9c5', '#abd5e8', '#f2c5ae'][i % 4], note: '密集日程示例，所有横条完整排列。'
      });
      hideDetail();
      calendar.replaceChildren();
      const weekdays = document.createElement('div'); weekdays.className = 'weekdays';
      for (const day of '一二三四五六日') { const label = document.createElement('span'); label.textContent = day; weekdays.append(label); }
      calendar.append(weekdays);
      for (let weekIndex = 0; weekIndex < weeks; weekIndex++) {
        const start = gridStart + weekIndex * 7, end = start + 6;
        const week = document.createElement('div'); week.className = 'week';
        const dates = document.createElement('div'); dates.className = 'dates';
        for (let i = 0; i < 7; i++) {
          const date = new Date((start + i) * 86400000), cell = document.createElement('div');
          const current = date.getUTCMonth() === month && date.getUTCFullYear() === year;
          cell.className = `day${i > 4 ? ' weekend' : ''}${current ? '' : ' out'}${current && date.getUTCDate() === today ? ' today' : ''}`;
          const number = document.createElement('span'); number.textContent = date.getUTCDate(); cell.append(number); dates.append(cell);
          if (current && date.getUTCDate() === today) cell.setAttribute('aria-current', 'date');
        }
        week.append(dates);
        const rows = [], segments = [];
        const tasks = activeTasks.filter(t => t.end >= start && t.start <= end).sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
        for (const task of tasks) {
          const a = Math.max(0, task.start - start), b = Math.min(6, task.end - start);
          let lane = 0;
          while (rows[lane] && rows[lane].some(([x, y]) => a <= y && b >= x)) lane++;
          (rows[lane] ||= []).push([a, b]); segments.push({ task, a, b, lane });
        }
        const layer = document.createElement('div'); layer.className = `lanes${rows.length ? '' : ' empty'}`;
        layer.style.setProperty('--lanes', rows.length);
        for (const { task, a, b, lane } of segments) {
          const bar = document.createElement('div'), before = task.start < start, after = task.end > end;
          bar.className = `event${before ? ' continues-before' : ''}${after ? ' continues-after' : ''}`;
          bar.dataset.id = task.id; bar.tabIndex = 0;
          bar.setAttribute('aria-label', `${task.title}，${dateText(task.start * 86400000)}至${dateText(task.end * 86400000)}`);
          bar.setAttribute('aria-describedby', 'details'); bar.textContent = task.title;
          bar.style.setProperty('--event-color', task.color); bar.style.setProperty('--lane', lane);
          const left = before ? 0 : 2, right = after ? 0 : 2;
          bar.style.left = `calc(${a * 100 / 7}% + ${left}px)`;
          bar.style.width = `calc(${(b - a + 1) * 100 / 7}% - ${left + right}px)`;
          layer.append(bar);
        }
        week.append(layer); calendar.append(week);
      }
      $('reminderFlag').hidden = density === 'empty';
      $('flagTip').hidden = true;
      requestAnimationFrame(fitScene);
    }
    function showDetail(id) {
      clearTimeout(detailTimer);
      if (shownId === id) return;
      const task = activeTasks.find(t => t.id === id); if (!task) return;
      shownId = id;
      $('detailTitle').textContent = task.title;
      const currentDay = dayNumber(dayTime(today));
      const status = currentDay < task.start ? `${task.start - currentDay} 天后开始` : currentDay > task.end ? '日期已结束' : task.end === currentDay ? '今天截止' : `${task.end - currentDay} 天后截止`;
      $('detailDate').textContent = `${dateText(task.start * 86400000)}${task.start === task.end ? '' : ` — ${dateText(task.end * 86400000)}`} · ${status}`;
      $('detailNote').textContent = task.note;
      $('details').style.setProperty('--detail-color', task.color);
      $('details').classList.add('show'); $('details').setAttribute('aria-hidden', 'false');
      for (const bar of calendar.querySelectorAll('.event')) bar.classList.toggle('hot', bar.dataset.id === id);
    }
    function hideDetail() {
      clearTimeout(detailTimer); shownId = null;
      $('details').classList.remove('show'); $('details').setAttribute('aria-hidden', 'true');
      for (const bar of calendar.querySelectorAll('.hot')) bar.classList.remove('hot');
    }
    calendar.addEventListener('pointerover', event => {
      const bar = event.target.closest('.event');
      if (bar && !dragging) showDetail(bar.dataset.id);
    });
    calendar.addEventListener('pointerout', event => {
      if (event.target.closest('.event') && !event.relatedTarget?.closest('.event')) detailTimer = setTimeout(hideDetail, 100);
    });
    calendar.addEventListener('focusin', event => { const bar = event.target.closest('.event'); if (bar) showDetail(bar.dataset.id); });
    calendar.addEventListener('focusout', event => { if (!event.relatedTarget?.closest('.event')) hideDetail(); });
    widget.addEventListener('pointerleave', hideDetail);
    $('reminderFlag').addEventListener('pointerenter', () => { $('flagTip').hidden = false; });
    $('reminderFlag').addEventListener('pointerleave', () => { $('flagTip').hidden = true; });
    $('reminderFlag').addEventListener('focus', () => { $('flagTip').hidden = false; });
    $('reminderFlag').addEventListener('blur', () => { $('flagTip').hidden = true; });

    function setPinned(value) {
      pinned = value; hideDetail();
      widget.classList.toggle('loose', !pinned); $('dragHandle').hidden = pinned;
      widget.setAttribute('aria-label', pinned ? '已钉住的桌面日历' : '可以拖动的桌面日历');
      $('placementBtn').textContent = pinned ? '解锁摆放' : '钉在桌面';
      $('placementBtn').setAttribute('aria-pressed', String(pinned));
      $('stateLabel').textContent = pinned ? '已钉住 · 悬停日程查看详情' : '摆放中 · 拖动挂件上方的提示条';
    }
    $('placementBtn').addEventListener('click', () => setPinned(!pinned));
    $('pinBtn').addEventListener('click', () => setPinned(true));
    function beginDrag(event, element) {
      if (event.button !== 0 || event.target.closest('button')) return;
      const rect = element.getBoundingClientRect(), bounds = scene.getBoundingClientRect();
      dragging = { element, pointer: event.pointerId, startX: event.clientX, startY: event.clientY, x: rect.left - bounds.left, y: rect.top - bounds.top };
      element.setPointerCapture(event.pointerId); element.classList.add('dragging'); hideDetail(); event.preventDefault();
    }
    $('dragHandle').addEventListener('pointerdown', event => { if (!pinned) beginDrag(event, widget); });
    $('workDrag').addEventListener('pointerdown', event => beginDrag(event, $('workWindow')));
    scene.addEventListener('pointermove', event => {
      if (!dragging || event.pointerId !== dragging.pointer) return;
      const element = dragging.element;
      const x = Math.max(12, Math.min(dragging.x + event.clientX - dragging.startX, scene.clientWidth - element.offsetWidth - 12));
      const y = Math.max(12, Math.min(dragging.y + event.clientY - dragging.startY, scene.clientHeight - element.offsetHeight - 58));
      element.style.left = `${x}px`; element.style.top = `${y}px`; element.style.right = 'auto';
      if (element === widget) widgetPosition = { x, y };
    });
    function endDrag(event) {
      if (!dragging || event.pointerId !== dragging.pointer) return;
      dragging.element.classList.remove('dragging');
      if (dragging.element.hasPointerCapture(event.pointerId)) dragging.element.releasePointerCapture(event.pointerId);
      dragging = null;
    }
    scene.addEventListener('pointerup', endDrag); scene.addEventListener('pointercancel', endDrag);

    function setCover(open) {
      hideDetail(); $('workWindow').hidden = !open; $('coverBtn').setAttribute('aria-pressed', String(open));
    }
    $('coverBtn').addEventListener('click', () => setCover($('workWindow').hidden));
    $('closeWork').addEventListener('click', () => setCover(false));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { hideDetail(); setCover(false); } });
    $('appearanceBtn').addEventListener('click', () => {
      $('adjustments').hidden = !$('adjustments').hidden;
      $('appearanceBtn').setAttribute('aria-expanded', String(!$('adjustments').hidden));
    });
    function applyAppearance() {
      const hex = $('panelColor').value.slice(1), value = parseInt(hex, 16);
      const rgb = [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      widget.style.setProperty('--panel-fill', `rgb(${rgb.join(' ')} / ${+$('opacityRange').value / 100})`);
      widget.style.setProperty('--text', $('textColor').value);
      widget.style.setProperty('--soft', `color-mix(in srgb, ${$('textColor').value} 72%, transparent)`);
      widget.style.setProperty('--weekend', $('weekendColor').value);
      widget.style.setProperty('--weekend-out', `color-mix(in srgb, ${$('weekendColor').value} 52%, transparent)`);
      widget.style.setProperty('--date-size', `${$('fontRange').value}px`);
      widget.style.setProperty('--glass-blur', `${$('blurRange').value}px`);
      widget.style.width = `${$('widthRange').value}px`;
      $('opacityValue').value = `${$('opacityRange').value}%`;
      $('widthValue').value = `${$('widthRange').value}px`;
      $('fontValue').value = `${$('fontRange').value}px`;
      $('blurValue').value = `${$('blurRange').value}px`;
    }
    for (const input of $('adjustments').querySelectorAll('input')) input.addEventListener('input', applyAppearance);
    $('density').addEventListener('change', renderCalendar);
    document.querySelector('.wall-options').addEventListener('click', event => {
      const button = event.target.closest('[data-wallpaper]'); if (!button) return;
      scene.dataset.wallpaper = button.dataset.wallpaper;
      $('customWallpaper').hidden = true; $('wallpaper').removeAttribute('hidden');
      if (customUrl) { URL.revokeObjectURL(customUrl); customUrl = null; }
      $('wallpaperFile').value = ''; $('wallpaperBtn').textContent = '自己的壁纸';
      for (const option of document.querySelectorAll('.wall-options button')) option.setAttribute('aria-pressed', String(option === button));
    });
    $('wallpaperBtn').addEventListener('click', () => $('wallpaperFile').click());
    $('wallpaperFile').addEventListener('change', () => {
      const file = $('wallpaperFile').files[0]; if (!file) return;
      if (!file.type.startsWith('image/')) return;
      const image = new Image(), candidate = URL.createObjectURL(file);
      image.onload = () => {
        if (customUrl) URL.revokeObjectURL(customUrl); customUrl = candidate;
        $('customWallpaper').style.backgroundImage = `url("${candidate}")`;
        $('customWallpaper').hidden = false; $('wallpaper').setAttribute('hidden', '');
        $('wallpaperBtn').textContent = '更换壁纸';
        for (const button of document.querySelectorAll('.wall-options button')) button.setAttribute('aria-pressed', 'false');
      };
      image.onerror = () => { URL.revokeObjectURL(candidate); $('stateLabel').textContent = '这张图片暂时无法显示，试试其他壁纸'; };
      image.src = candidate;
    });
    function updateClock() {
      const date = new Date();
      $('clock').textContent = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      $('desktopDate').textContent = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
    }
    applyAppearance(); renderCalendar(); updateClock(); setInterval(updateClock, 30000);
  </script>
</body>
</html>
