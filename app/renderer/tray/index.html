<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>小鱼</title>
  <link rel="stylesheet" href="tray.css">
</head>
<body>
  <div class="tray-menu" role="menu" aria-label="小鱼菜单">
    <button type="button" role="menuitem" data-action="show" tabindex="0">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="3"/><path d="M6.5 2.8v3.4m7-3.4v3.4M3.5 8.2h13"/></svg>
      <span>显示主界面</span>
    </button>
    <button type="button" role="menuitem" data-action="pin" tabindex="-1">
      <svg id="pinIcon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.3 8V5.8a3.7 3.7 0 0 1 7.2-1.1"/><rect x="4.7" y="8" width="10.6" height="8.5" rx="2.5"/><path d="M10 11.3v2"/></svg>
      <span id="pinLabel">解锁桌面挂件</span>
    </button>
    <button type="button" role="menuitem" data-action="settings" tabindex="-1">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.3 5.1h4.2m4 0h5.2M3.3 10h8.2m4 0h1.2M3.3 14.9h1.2m4 0h8.2"/><circle cx="9.5" cy="5.1" r="2"/><circle cx="13.5" cy="10" r="2"/><circle cx="6.5" cy="14.9" r="2"/></svg>
      <span>设置</span>
    </button>
    <div class="separator" role="separator"></div>
    <button type="button" role="menuitem" data-action="restart" tabindex="-1">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7.1A6.4 6.4 0 1 0 16.3 12M16.2 3.6v4.1h-4.1"/></svg>
      <span>重启</span>
    </button>
    <button type="button" role="menuitem" class="quit" data-action="quit" tabindex="-1">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8v7M6.1 5.3a6.2 6.2 0 1 0 7.8 0"/></svg>
      <span>退出</span>
    </button>
  </div>
  <script src="tray.js"></script>
</body>
</html>
