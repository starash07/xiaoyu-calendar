<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鱼日程表</title>
<link rel="stylesheet" href="../shared/calendar.css">
<link rel="stylesheet" href="w2.css">
</head>
<body>
<div class="app-shell" id="appShell">
<header class="top">
  <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="brand">小鱼日程表</span>
  <span class="spacer"></span>
  <button class="icon settings-button" id="settingsBtn" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/></svg></button>
  <button class="icon" id="closeBtn" type="button" title="收起窗口" aria-label="收起窗口"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M7 17 17 7"/></svg></button>
</header>

<main class="workspace">
  <section class="calendar-panel" aria-label="月历">
    <section class="reminder-section" id="reminderSection" hidden aria-label="待确认提醒">
      <div class="reminder-head"><b id="reminderHead"></b></div>
      <div class="reminders" id="reminders" hidden></div>
    </section>

    <section class="calendar-toolbar" aria-label="月份和快捷操作">
      <div class="month-pill">
        <button class="month-step" id="prevBtn" type="button" title="上一月（PageUp）" aria-label="上一月"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-step" id="nextBtn" type="button" title="下一月（PageDown）" aria-label="下一月"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      </div>
      <button class="today-button" id="todayBtn" type="button">回到今天</button>
      <button class="new-button" id="newBtn" type="button" title="新建日程（Ctrl+N）"><span aria-hidden="true">＋</span>新建日程</button>
    </section>

    <div class="content">
      <div class="calwrap" id="calwrap">
        <div id="cal"></div>
        <div class="empty" id="empty" hidden>这个月还是空白的。<button id="emptyNewBtn" type="button">记下第一件事</button></div>
      </div>
    </div>

    <section class="detail-section" id="detailSection" aria-label="日程详情" aria-hidden="true">
      <div class="detail-card" id="detail" hidden></div>
      <div class="detail-actions" id="detailActions" hidden></div>
    </section>
  </section>
</main>


<div class="daylabel" id="daylabel" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="modal" hidden></div>
<div class="overlay" id="confirm" hidden></div>
</div>

<script src="../shared/dates.js"></script>
<script src="../shared/colors.js"></script>
<script src="../shared/appearance.js"></script>
<script src="../shared/calendar.js"></script>
<script src="w2.js"></script>
<script src="dialog.js"></script>
</body>
</html>
